name: Casey preview verification
on:
  pull_request:
    branches: [main, feature/casey-live-5-2]
  push:
    branches: [feature/casey-6-gemini-tools, feature/casey-6-handoff, "fix/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/casey-handoff/index.ts supabase/functions/casey-handoff-live/index.ts supabase/functions/casey-beta/index.ts supabase/functions/casey-beta-live/index.ts
      - run: deno test --allow-env --allow-read=supabase/functions/_shared tests/handoff-operations.test.ts tests/definitivo-rag.test.ts tests/semantic-rag.test.ts tests/beta-mail.test.ts tests/beta-live.test.ts tests/paid-capacity.test.ts
      - run: git diff --check
  handbook-import-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/hfarm-rag/requirements.txt
      - run: python -m unittest test_safety -v
        working-directory: tools/hfarm-rag
