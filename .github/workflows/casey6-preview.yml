name: Casey preview verification
on:
  pull_request:
    branches: [main, feature/casey-live-5-2]
  push:
    branches: [feature/casey-6-gemini-tools, feature/casey-6-handoff]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/casey-handoff/index.ts supabase/functions/casey-handoff-live/index.ts
      - run: deno test tests/handoff-operations.test.ts
      - run: git diff --check
