name: Casey preview verification
on:
  pull_request:
    branches: [main, feature/casey-live-5-2]
  push:
    branches: [feature/casey-6-gemini-tools]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: git diff --check
