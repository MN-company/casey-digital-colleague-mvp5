/* =====================================================================
   Casey · design system condiviso tra app rossa (H-FARM Campus) e app blu
   (H-FARM College). Stesso contenitore dell'MVP: telefono pulito su sfondo
   scuro, solo la barra di stato minimale.
   ===================================================================== */
:root{
  --ink:#121426; --ink2:#4A4D63; --mute:#676A7E; --line:#E7E7EE; --soft:#F3F3F7; --soft2:#EEEFF5;
  --navy:#21264D; --navy2:#2E3570; --college:#1D2A5B; --college2:#2B3A74;
  --red:#E4342A; --red-d:#C32B22; --cred:#B3263A; --green:#14A06B; --amber:#E39A1C; --coral:#F4625C;
  --page:#0C1020;
  --sh1:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --sh2:0 6px 16px rgba(20,20,40,.08);
  --sh3:0 10px 26px rgba(33,38,77,.26);
  --r-card:20px;
  font-synthesis:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--page);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 12px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
img{display:block}
a{color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- contenitore del telefono (come nell'MVP) ---------- */
.phone{width:402px;max-width:100%;height:860px;max-height:calc(100vh - 40px);background:#fff;border-radius:36px;
  overflow:hidden;display:flex;flex-direction:column;position:relative;isolation:isolate;
  box-shadow:0 26px 70px rgba(0,0,0,.55);border:10px solid #080B14}
.sb{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;font-size:12px;font-weight:700;color:var(--ink);background:#fff;position:relative;z-index:5}
.sb .sbi{display:flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.02em}
.sb .sbi svg{height:11px;width:auto;display:block}
.app{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform}
.view.off-right{transform:translateX(102%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}

/* splash */
.splash{position:absolute;inset:0;background:#fff;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .45s}
.splash.go{opacity:0;pointer-events:none}
.splash img{width:148px;height:auto}
.splash .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--soft2);border-top-color:var(--brand,var(--navy));animation:sp .85s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* pulsante flottante di Casey */
.caseyb{position:absolute;right:16px;bottom:18px;width:62px;height:62px;z-index:40;transition:transform .2s,opacity .2s}
.caseyb .ph{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#fff;border:3px solid #fff;box-shadow:0 10px 26px rgba(16,20,40,.32)}
.caseyb img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.caseyb .bd{position:absolute;top:-2px;right:-2px;min-width:19px;height:19px;border-radius:10px;background:var(--red);border:2.5px solid #fff;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px}
.caseyb:active{transform:scale(.94)}
.caseyb.gone{opacity:0;pointer-events:none;transform:scale(.8)}

/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);background:rgba(18,20,38,.94);color:#fff;font-size:13px;font-weight:600;padding:10px 14px;border-radius:14px;z-index:250;opacity:0;transition:.25s;max-width:320px;text-align:center;pointer-events:none;line-height:1.35}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* foglio dal basso (fonti, QR, moduli) */
.bsw{position:absolute;inset:0;z-index:200;pointer-events:none}
.bsw .dim{position:absolute;inset:0;background:rgba(10,12,30,.42);opacity:0;transition:.25s}
.bsw .bs{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:10px 18px 26px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:82%;overflow:auto;box-shadow:0 -12px 30px rgba(0,0,0,.12)}
.bsw.open{pointer-events:auto}
.bsw.open .dim{opacity:1}
.bsw.open .bs{transform:none}
.bs .grab{width:40px;height:5px;border-radius:5px;background:#D5D6DE;margin:0 auto 12px}
.bs h4{font-size:18px;line-height:1.2}
.bs .kick{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cred);margin-bottom:4px}
.bs blockquote{margin-top:12px;border-left:3px solid var(--navy);padding:8px 12px;background:#F6F7FB;border-radius:0 12px 12px 0;font-size:14px;line-height:1.5}
.bs .bsn{font-size:12.5px;color:var(--ink2);margin-top:10px;line-height:1.45}
.bs .abtn{margin-top:14px;width:100%}
.bs .abtn+.abtn{margin-top:8px}
.bigqr{display:grid;place-items:center;margin:16px 0 6px}
.bigqr svg{border-radius:12px;box-shadow:0 0 0 10px #fff,0 0 0 11px var(--line)}

/* foglio della chat reale (college.html), gestito da app-auth-shell.js */
.sheet{position:absolute;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:flex-end;z-index:280}
.sheet.off{display:none}
.inner{background:#fff;width:100%;max-height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .34s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* ---------- messaggi ---------- */
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg.anim{animation:pop .28s ease}
.msg .fa{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:0 0 28px;background:#fff;border:1px solid var(--line)}
.msg .fa img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.bub{max-width:84%;background:var(--soft);border-radius:20px 20px 20px 6px;padding:10px 13px;font-size:14.4px;line-height:1.42;color:var(--ink);overflow-wrap:anywhere}
.bub p+p{margin-top:6px}
.bub b{font-weight:700}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--navy);color:#fff;border-radius:20px 20px 6px 20px}
.msg.me .bub .meta{color:#B9BDE3}
.meta{font-size:10.5px;color:var(--mute);margin-top:4px;text-align:right}
.src{display:inline-flex;align-items:center;gap:5px;margin-top:8px;margin-right:4px;font-size:11.5px;font-weight:700;color:var(--navy);background:#fff;border:1px solid #DADDF0;padding:4px 9px;border-radius:20px;text-align:left;line-height:1.2}
.src svg{width:13px;height:13px;flex:0 0 13px}
.src:hover{border-color:var(--navy)}
.acts{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.acts.row{flex-direction:row;flex-wrap:wrap}
.abtn{display:flex;align-items:center;gap:8px;justify-content:center;padding:11px 12px;border-radius:14px;font-weight:700;font-size:14px;background:#fff;border:1px solid #DADDF0;color:var(--navy);text-align:center;transition:.15s;text-decoration:none}
.abtn:hover{border-color:var(--navy)}
.abtn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.abtn.red{background:var(--cred);border-color:var(--cred);color:#fff}
.abtn svg{width:17px;height:17px;flex:0 0 17px}
.abtn[disabled]{opacity:.45;pointer-events:none}
.abtn.picked[disabled]{opacity:1}
.abtn.picked{background:#E2F6EC;border-color:#9BD9BC;color:#0B6E48}
.slot{justify-content:flex-start;text-align:left;gap:10px}
.slot .sl{display:flex;flex-direction:column;line-height:1.25}
.slot .sl small{font-weight:600;color:var(--ink2);font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
.card .ct{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px}
.card .ct .ok{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.card .ct .ok svg{width:13px;height:13px}
.card .ct>svg{width:18px;height:18px;flex:0 0 18px;color:var(--navy)}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:8px;font-size:13px}
.card dt{color:var(--mute);font-weight:600}
.card dd{font-weight:600}
.office{display:flex;gap:10px;align-items:center}
.office .oi{width:38px;height:38px;border-radius:12px;background:#E8EAF6;color:var(--navy);display:grid;place-items:center;flex:0 0 38px;font-weight:800;font-size:13px}
.office b{display:block;font-size:14px}
.office small{display:block;font-size:12px;color:var(--ink2);line-height:1.3}
.office code{font-family:inherit;font-weight:700;color:var(--navy);font-size:12.5px;display:block;margin-top:2px}
.mail{font-size:13px;line-height:1.45;white-space:pre-wrap;color:var(--ink);background:#FAFAFC;border-radius:12px;padding:10px;margin-top:8px;border:1px dashed #D9DBE8}
.proto{font-size:11px;color:var(--mute);margin-top:8px;line-height:1.35}
.qrmini{display:grid;place-items:center;margin-top:10px}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:#A3A6BA;display:block;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.pill.green{background:#E2F6EC;color:#0B6E48}
.pill.navy{background:#E8EAF6;color:var(--navy)}
.pill.grey{background:var(--soft);color:var(--ink2)}
.pill.amber{background:#FFF1DA;color:#8A5300}

/* eventi nella chat: sempre in colonna, mai caroselli */
.evc{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin-top:10px}
.evc-top{padding:10px 12px;color:#fff}
.evc-top b{display:block;font-size:15px;line-height:1.2;margin-top:5px;font-weight:800}
.evc-tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.28);padding:2px 7px;border-radius:20px}
.evc-body{padding:9px 12px 11px}
.evc-row{display:flex;gap:7px;align-items:flex-start;font-size:12.8px;color:var(--ink2);line-height:1.35;margin-top:3px}
.evc-row svg{width:14px;height:14px;flex:0 0 14px;margin-top:2px;color:var(--navy)}
.evc-acts{display:flex;gap:6px;margin-top:9px}
.evc-acts .abtn{flex:1;padding:8px;font-size:12.8px;border-radius:12px;gap:5px}
.evc-acts .abtn svg{width:14px;height:14px;flex:0 0 14px}
.e1{background:radial-gradient(circle at 80% 20%,#FF8A00 0%,rgba(255,138,0,0) 45%),linear-gradient(135deg,#1B1F3B,#3A2A6B)}
.e2{background:radial-gradient(circle at 20% 30%,#FF5E62 0%,rgba(255,94,98,0) 50%),linear-gradient(135deg,#2B1E1E,#7A2E2E)}
.e3{background:radial-gradient(circle at 70% 70%,#2BD2FF 0%,rgba(43,210,255,0) 50%),linear-gradient(135deg,#0D1B2A,#1B3A5B)}
.e4{background:radial-gradient(circle at 30% 70%,#F9D423 0%,rgba(249,212,35,0) 50%),linear-gradient(135deg,#3B2B12,#7A5A1E)}
.e5{background:radial-gradient(circle at 75% 30%,#8C6CFF 0%,rgba(140,108,255,0) 50%),linear-gradient(135deg,#241C44,#3A2E6B)}

/* suggerimenti: vanno a capo, niente scorrimento orizzontale */
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:8px 14px 6px;flex:0 0 auto}
.chip{padding:7px 11px;border-radius:20px;border:1px solid #DADDF0;font-size:12.6px;font-weight:600;color:var(--navy);background:#fff;line-height:1.25;max-width:100%}
.chip:hover{border-color:var(--navy)}
.chip.hot{background:#E8EAF6;border-color:#E8EAF6}

@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(179,38,58,.5)}100%{box-shadow:0 0 0 7px rgba(179,38,58,0)}}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes glow{0%,100%{box-shadow:var(--sh3)}50%{box-shadow:0 10px 34px rgba(179,38,58,.42)}}

:focus{outline:none}
:focus-visible{outline:2.5px solid #5B6BFF;outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---------- su un telefono vero l'app occupa tutto lo schermo ---------- */
@media (max-width:500px){
  body{padding:0;display:block;background:#fff}
  .phone{width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
  .sb{display:none}
}

/* =====================================================================
   App blu · H-FARM College
   Stesso design system dell'app rossa, nel blu del College.
   ===================================================================== */
body{--brand:var(--college);--navy:#1D2A5B;--navy2:#2B3A74;--tint:#EEF1F8;--tint2:#E2E7F3}
.splash img{width:150px}

/* ---------- intestazione ---------- */
.ahdr{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 18px 8px;background:#fff;position:relative;z-index:6}
.ahdr .logo img{height:44px;width:auto}
.avbtn{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:.02em;box-shadow:0 4px 12px rgba(29,42,91,.28);transition:box-shadow .2s}
.avbtn[aria-current="page"]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--navy)}

/* ---------- viste delle sezioni ---------- */
.view[hidden]{display:none!important}
.tpad{padding-bottom:110px}
.greet{padding:6px 18px 0;font-size:26px;line-height:1.12;font-weight:500;letter-spacing:-.02em}
.greet b{font-weight:800}
.greet small{display:block;font-size:13px;font-weight:600;color:var(--mute);letter-spacing:0;margin-top:5px}

/* le sei icone rapide (come l'app originale, nello stile nuovo) */
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 16px 2px}
.qt{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:13px 4px 12px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh1);transition:transform .15s,background .2s,box-shadow .2s,border-color .2s;min-width:0}
.qt .ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--navy);transition:background .2s,color .2s}
.qt .ib svg{width:23px;height:23px}
.qt .l{font-size:10.4px;font-weight:800;color:var(--navy);text-align:center;line-height:1.2;letter-spacing:.05em;text-transform:uppercase}
.qt[aria-pressed="true"]{background:linear-gradient(140deg,#1D2A5B,#2E3D7C);border-color:transparent;box-shadow:var(--sh3)}
.qt[aria-pressed="true"] .ib{background:rgba(255,255,255,.16);color:#fff}
.qt[aria-pressed="true"] .l{color:#fff}
.qt:active{transform:scale(.97)}

.shead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:22px 18px 11px}
.shead h3{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.shead .k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);white-space:nowrap}

/* Game Changer Italy */
.gci{display:block;margin:18px 16px 0;border-radius:24px;color:#fff;padding:16px 16px 14px;position:relative;overflow:hidden;box-shadow:var(--sh3);text-align:left}
.gci::after{content:"";position:absolute;right:-50px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(244,98,92,.42),rgba(244,98,92,0) 70%);pointer-events:none}
.gci .kk{position:relative;z-index:1;display:inline-flex;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;background:rgba(255,255,255,.16);padding:4px 9px;border-radius:20px}
.gci .tt{position:relative;z-index:1;display:block;font-size:19.5px;font-weight:800;line-height:1.1;letter-spacing:-.01em;margin-top:10px}
.gci .mt{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;margin-top:9px;font-size:12.8px;color:#DCE3F5;font-weight:500}
.gci .mt span{display:flex;align-items:center;gap:7px}
.gci .mt svg{width:15px;height:15px;flex:0 0 15px}
.gci .go{position:relative;z-index:1;display:flex;gap:8px;margin-top:13px}
.gci .go>*{flex:1;padding:10px 8px;border-radius:14px;font-weight:700;font-size:13.2px;text-align:center;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.gci .go .w{background:#fff;color:var(--navy)}
.gci .go svg{width:15px;height:15px;flex:0 0 15px}
.gci .go img{width:20px;height:20px;border-radius:50%;object-fit:cover;object-position:50% 25%}

/* weekly schedule: griglia 2x2, solo verticale */
.week{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.wk{border-radius:18px;min-height:98px;padding:12px 12px 11px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-shadow:var(--sh2);text-align:left;transition:transform .15s;position:relative;overflow:hidden}
.wk:active{transform:scale(.98)}
.wk .d{font-size:10.3px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.92}
.wk b{font-size:14.5px;line-height:1.15;font-weight:800;letter-spacing:-.005em}

/* sottoschede (Students / College / H-FARM ...) */
.stabs{display:flex;gap:4px;margin:20px 16px 14px;background:var(--soft);border-radius:14px;padding:3px}
.stabs button{flex:1;padding:8px 4px;border-radius:11px;font-size:13px;font-weight:700;color:var(--ink2);text-align:center;transition:background .2s,color .2s}
.stabs button[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stabs.first{margin-top:4px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:0 16px}
.gc{display:block;text-align:left;min-width:0}
.gc .ph{height:104px;border-radius:18px;display:flex;align-items:flex-end;padding:11px 12px;color:#fff;font-size:11.8px;font-weight:700;line-height:1.3;box-shadow:var(--sh2);transition:transform .15s}
.gc:active .ph{transform:scale(.98)}
.gc .cp{display:block;font-size:11.8px;font-weight:800;color:var(--navy);margin-top:8px;line-height:1.25;letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}

.lst{margin:0 16px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--sh1)}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:#fff;transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:#FAFBFE}
.row .ri{width:34px;height:34px;border-radius:11px;background:var(--tint);color:var(--navy);display:grid;place-items:center;flex:none}
.row .ri svg{width:18px;height:18px}
.row .rt{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.3}
.row .rt small{display:block;font-size:12px;color:var(--mute);font-weight:500;margin-top:2px}
.row .ra{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--navy)}
.row .ra svg{width:14px;height:14px}
.lst+.lst{margin-top:12px}
.ltitle{padding:4px 18px 10px;font-size:17px;font-weight:800;letter-spacing:-.01em}

.note{margin:0 16px;background:#FFF1DA;color:#8A5300;border-radius:16px;padding:14px 16px;font-size:14px;font-weight:600;line-height:1.4}
.askrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 16px 0}
.askb{display:inline-flex;align-items:center;gap:7px;padding:8px 12px 8px 8px;border-radius:20px;background:var(--tint);color:var(--navy);font-size:12.8px;font-weight:700}
.askb img{width:22px;height:22px;border-radius:50%;object-fit:cover;object-position:50% 25%;background:var(--navy)}

/* calendario (Pronote) */
.bigic{width:116px;height:116px;border-radius:50%;background:linear-gradient(135deg,#F4625C,#F98C63);display:grid;place-items:center;margin:22px auto 14px;box-shadow:0 12px 26px rgba(244,98,92,.32)}
.ctr{text-align:center;padding:0 24px}
.ctr .t{font-size:22px;font-weight:800;letter-spacing:.05em}
.ctr .ds{font-size:13.6px;color:var(--ink2);margin-top:6px;line-height:1.45}
.ctr .acts{align-items:center}
.ctr .abtn{width:100%;max-width:280px}

/* mappa */
.msearch{display:flex;align-items:center;gap:10px;margin:6px 16px 0;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--mute)}
.msearch svg{width:18px;height:18px;flex:none}
.mchips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 16px}
.mchips button{border:1px solid #DADDF0;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;background:#fff;color:var(--navy);transition:.15s}
.mchips button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.mapbox{margin:0 16px;border-radius:20px;overflow:hidden;box-shadow:var(--sh2);border:1px solid var(--line)}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .pin{transition:opacity .2s}
.mapbox .pin.dim{opacity:.25}
.minfo{display:flex;gap:12px;margin:14px 16px 0;padding:12px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh1);align-items:flex-start}
.minfo .mi{width:84px;height:64px;border-radius:12px;flex:none;background:linear-gradient(135deg,#6B8E4E,#A3B86C);display:grid;place-items:center;color:#fff}
.minfo .mi svg{width:26px;height:26px}
.minfo b{display:block;font-size:16px;font-weight:800}
.minfo p{font-size:13px;color:var(--ink2);line-height:1.4;margin-top:3px}

/* profilo */
.pcover{margin:6px 16px 0;height:150px;border-radius:24px;background:radial-gradient(circle at 85% 15%,rgba(244,98,92,.38),rgba(244,98,92,0) 45%),linear-gradient(135deg,#1D2A5B,#4D5E9E);position:relative;box-shadow:var(--sh3)}
.pcover .dl{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700}
.pcover .dl svg{width:15px;height:15px}
.pav{position:absolute;left:50%;bottom:-44px;transform:translateX(-50%);width:92px;height:92px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:30px;font-weight:800;border:4px solid #fff;box-shadow:0 8px 20px rgba(16,24,60,.22)}
.pname{text-align:center;font-size:21px;font-weight:800;margin-top:54px;letter-spacing:-.01em}
.prole{text-align:center;font-size:13px;color:var(--ink2);margin-top:3px}
.pbox{margin:6px 16px 0;border:1px solid var(--line);border-radius:20px;padding:4px 14px 2px;box-shadow:var(--sh1);background:#fff}
.pbox .stabs{margin:10px 0 14px}
.pbox .lst{margin:0 0 12px;box-shadow:none}
.fld{margin-bottom:14px}
.fld .lb{font-size:12px;color:var(--mute);font-weight:600}
.fld .vl{font-size:14.5px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.fsec{font-size:15px;font-weight:800;margin:4px 0 8px}

/* ---------- barra inferiore: 5 voci, l'ultima è Casey ---------- */
.nav{flex:0 0 auto;display:flex;justify-content:space-around;align-items:flex-start;padding:7px 4px 12px;border-top:1px solid var(--line);background:rgba(255,255,255,.97);position:relative;z-index:30}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;color:#8C93AB;padding:0 2px}
.nav .ni{width:54px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s,color .2s,box-shadow .2s}
.nav .ni svg{width:22px;height:22px}
.nav .nl{font-size:10.6px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--navy)}
.nav button[aria-current="page"] .ni{background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(29,42,91,.3)}
.nav .cnav{color:var(--navy)}
.nav .cnav .ni{background:var(--tint)}
.nav svg .spark{fill:var(--coral);stroke:var(--coral)}

/* pulsante flottante di Casey: solo nella Home, sopra la barra */
.caseyb{bottom:86px}
.caseyb .ph{background:var(--navy)}

/* ---------- vista di Casey (5a voce) ---------- */
.cv{background:#fff}
.chead{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 12px 10px;border-bottom:1px solid var(--line);background:#fff}
.cava{position:relative;flex:0 0 46px;width:46px;height:46px}
.cava .im{display:block;width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--navy);box-shadow:0 0 0 2px #fff,0 0 0 4px #CDEBDD}
.cava img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.cava i{position:absolute;right:-1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:var(--green);border:2.5px solid #fff}
.cwho{flex:1;min-width:0}
.cwho b{display:block;font-size:17px;line-height:1.15}
.cwho small{display:flex;align-items:center;gap:5px;font-size:11.8px;color:#0B7A50;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cwho small span{color:var(--mute);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.hbtn{height:36px;min-width:36px;padding:0 11px;border-radius:18px;background:var(--tint);color:var(--navy);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;flex:none}
.hbtn svg{width:17px;height:17px}
.hbtn.icon{padding:0;width:36px}
.hbtn[aria-pressed="true"]{background:var(--navy);color:#fff}
.cbody{flex:1;min-height:0;display:flex;position:relative}

/* colonna sinistra: storico */
.hist{width:132px;flex:0 0 132px;border-right:1px solid var(--line);background:#F6F7FB;display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:flex-basis .28s cubic-bezier(.2,.8,.2,1),width .28s cubic-bezier(.2,.8,.2,1)}
.cbody.nohist .hist{width:0;flex-basis:0;border-right-width:0}
.hin{width:132px;display:flex;flex-direction:column;min-height:0;flex:1}
.hnew{margin:10px 8px 4px;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 8px;border-radius:13px;background:var(--navy);color:#fff;font-size:12.4px;font-weight:800;box-shadow:0 4px 12px rgba(29,42,91,.25);flex:none}
.hnew svg{width:15px;height:15px}
.hlist{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 6px 8px;scrollbar-width:none}
.hlist::-webkit-scrollbar{display:none}
.hgrp{font-size:9.8px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);padding:11px 6px 4px}
.hit{display:block;width:100%;text-align:left;padding:8px;border-radius:12px;margin-bottom:2px;transition:background .15s}
.hit b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.3px;line-height:1.28;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.hit small{display:block;font-size:10.6px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit:hover{background:#ECEFF7}
.hit[aria-current="true"]{background:#fff;box-shadow:var(--sh1),inset 3px 0 0 var(--navy)}
.hempty{font-size:11.5px;color:var(--mute);padding:10px 6px;line-height:1.4}
.hfoot{flex:none;padding:8px 10px 10px;border-top:1px solid var(--line);font-size:10.4px;color:var(--mute);line-height:1.35}
.hfoot button{display:block;color:var(--navy);font-weight:800;font-size:11px;margin-top:3px;text-decoration:underline;text-underline-offset:2px}

/* area destra: chat */
.chat{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:#fff}
.ctop{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;border-bottom:1px solid var(--line)}
.ctop .tt{flex:1;min-width:0}
.ctop .tt b{display:block;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctop .tt small{display:block;font-size:10.8px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctop .hbtn{height:30px;min-width:30px;border-radius:15px}
.ctop .hbtn svg{width:15px;height:15px}
#cScroll{position:relative}
.thread{padding:12px 10px 10px;display:flex;flex-direction:column;gap:10px}
.chat .bub{font-size:13.6px;padding:9px 11px;max-width:86%}
.chat .msg .fa{width:24px;height:24px;flex:0 0 24px}
.chat .msg{gap:6px}
.chat .abtn{font-size:13px;padding:9px 10px;border-radius:12px}
.chat .card{padding:10px}
.chat .evc-acts{flex-direction:column}
.chat .evc-acts .abtn{flex:none;font-size:12.6px}
.day{align-self:center;font-size:10.8px;font-weight:700;color:var(--mute);background:var(--soft);padding:3px 10px;border-radius:20px}
.welcome{padding:22px 14px 14px;text-align:center}
.welcome .wf{width:78px;height:78px;border-radius:50%;margin:0 auto 12px;overflow:hidden;background:var(--navy);box-shadow:0 0 0 4px #fff,0 0 0 6px var(--tint2),var(--sh2)}
.welcome .wf img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.welcome h4{font-size:17px;line-height:1.25}
.welcome p{font-size:12.8px;color:var(--ink2);line-height:1.45;margin-top:6px}
.sugg{display:flex;flex-direction:column;gap:7px;margin-top:14px;text-align:left}
.sugg button{padding:9px 11px;border-radius:14px;border:1px solid #DADDF0;font-size:12.6px;font-weight:600;color:var(--navy);background:#fff;line-height:1.3;transition:border-color .15s,background .15s}
.sugg button:hover{border-color:var(--navy);background:#FAFBFE}
.welcome .hint{font-size:11px;color:var(--mute);margin-top:12px;line-height:1.4}
.inbar{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 8px 10px;border-top:1px solid var(--line);background:#fff}
.inw{flex:1;min-width:0;position:relative}
.inw input{width:100%;border:1px solid transparent;background:var(--soft);border-radius:21px;padding:10px 38px 10px 13px;font-size:14px;outline:none;transition:border-color .15s,background .15s}
.inw input:focus{border-color:#C9CFE6;background:#fff}
.mic{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--navy)}
.mic svg{width:18px;height:18px}
.mic.on{background:var(--cred);color:#fff}
.mic.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--cred);animation:ring 1.2s infinite}
.send{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:0 0 40px;box-shadow:0 4px 12px rgba(29,42,91,.3);transition:opacity .15s}
.send svg{width:18px;height:18px}
.send[disabled]{opacity:.45;box-shadow:none}

/* telefoni stretti: la colonna dello storico si stringe un po' */
@media (max-width:370px){
  .hist,.hin{width:116px;flex-basis:116px}
  .hnew{font-size:11.6px;gap:4px}
  .nav .ni{width:48px}
}
@media (max-width:500px){
  .ahdr{padding-top:calc(6px + env(safe-area-inset-top,0px))}

  .nav{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .caseyb{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
}

function evIdOf(q) {
  if (q.includes('game changer') || q.includes('gamechanger')) return 'gci';
  if (q.includes('storming')) return 'sp';
  if (q.includes('tech-voluzione') || q.includes('techvoluzione') || q.includes('tech voluzione')) return 'tech';
  if (q.includes('inspirational') || (q.includes(' talk ') && !/ talk (to|with) /.test(q))) return 'talk';
  if (has(q, ["cosa c'e", 'cosa succede', 'evento', 'eventi', 'programma', "what's on", 'whats on', 'happening'])) {
    for (const id of ['gci', 'talk']) {
      const e = EVENTS[id], d = evStart(e); if (!d || evPast(e)) continue;
      const g = norm(GIORNI[d.getDay()]).trim(), dm = d.getDate() + ' ' + MESI[d.getMonth()], n = dayDiff(d, now());
      if ((q.includes(' ' + g) && n < 7) || (q.includes(' ' + g + ' prossim') && n < 14) || q.includes(' ' + dm) || (q.includes(' domani') && n === 1) || (q.includes(' oggi') && n === 0)) return id;
    }
  }
  return null;
}
// ctx: { lastEvent, lunchToday }
function classify(text, ctx = {}) {
  const q = norm(text);
  const R = (k, a) => ({ k, a, q });
  if (has(q, K.prot)) return R('prot');
  if (has(q, K.well)) return R('well');
  if (has(q, K.emerg)) return R('emerg');
  if (has(q, K.who)) return R('who');
  if (has(q, K.human)) return R('human');
  if (/^ (che ore sono|che ora e|che ore e|che giorno e( oggi)?|che giorno siamo( oggi)?|oggi che giorno e|quanti ne abbiamo( oggi)?|what time is it|what day is it( today)?) $/.test(q)) return R('time');
  const evId = evIdOf(q);
  const lunchW = has(q, K.lunch);
  const officeK = Object.keys(OFFICES).find((k) => OFFICES[k].k.length && hasW(q, OFFICES[k].k));
  const parcelW = has(q, K.parcel);
  const wantsReg = has(q, K.reg) && !has(q, K.notCourse);
  if (K.cancel.test(q) && (lunchW || evId || has(q, ['iscrizione', 'prenotazione', 'registrazione', 'booking', 'registration', 'evento']))) return R('cancel', { evId, lunch: lunchW });
  if (evId && has(q, K.speak)) return R('evinfo', { id: evId, kind: 'speakers' });
  if (!evId && ctx.lastEvent && has(q, ['speaker', 'chi parla', 'relator', 'ospiti', 'chi interviene'])) return R('evinfo', { id: ctx.lastEvent, kind: 'speakers' });
  if (has(q, K.price) && (evId || (ctx.lastEvent && !lunchW && !officeK && !has(q, K.gym) && !has(q, K.sportRent) && !has(q, K.digital)))) return R('evinfo', { id: evId || ctx.lastEvent, kind: 'price' });
  if (q.includes('networking')) return R('evinfo', { id: evId || 'gci', kind: 'networking' });
  if (has(q, ['pagina di iscrizione', 'link di iscrizione', 'link per iscriver', 'pagina per iscriver', 'dove mi iscrivo', 'pagina di registrazione', "pagina dell'evento", 'registration page', 'registration link', 'link to register'])) return R('regpage', { id: evId || ctx.lastEvent || 'gci' });
  if (wantsReg && evId) return R('register', { id: evId });
  if (wantsReg && ctx.lastEvent && !officeK && !lunchW && !parcelW && words(q) <= 6) return R('register', { id: ctx.lastEvent });
  if (evId) return R('event', { id: evId });
  if (has(q, ['hacktoberfest', 'hack day'])) return R('hack');
  if (q.includes('grok')) return R('grok');
  if (parcelW) return R('parcel');
  const isWay = has(q, K.way);
  const dest = Object.keys(WF).find((key) => WF[key].k.length && has(q, WF[key].k));
  if (isWay && dest) return R('way', { dest });
  if (isWay && lunchW && ctx.lunchToday) return R('way', { dest: RESTOS[ctx.lunchToday].wf });
  if (lunchW) return R(K.book.test(q) || /^ prenota /.test(q) ? 'lunchbook' : 'lunch');
  if (has(q, K.digital)) return R('digital');
  if (has(q, K.gym)) return R('gym');
  if (has(q, K.sportRent)) return R('sportRent');
  if (has(q, K.mobility)) return R('mobility');
  if (has(q, K.shop)) return R('shop');
  if (has(q, K.newsletter)) return R('newsletter');
  if (has(q, K.events) || (q.includes("cosa c'e") && has(q, ['settimana', 'oggi', 'domani', 'stasera', 'weekend'])) || (wantsReg && !officeK)) return R('events');
  const badgeW = has(q, ['badge', 'tesserino']);
  if (badgeW && has(q, K.badgeLost)) return R('badgeLost');
  if (badgeW) return R('badge');
  if (has(q, ['check-in', 'check in', 'checkin', 'check-out', 'check out', 'checkout', 'presenza in aula', 'registrare la presenza', 'firmare la presenza'])) return R('checkin');
  if (has(q, ['esame perso', 'perso un esame', "perso l'esame", "saltato l'esame", 'saltato un esame', 'mitigating', 'missed an exam', 'missed my exam'])) return R('mitig');
  if (has(q, [' rata', ' rate ', 'retta', 'tasse', 'tuition', 'dilazion', 'rateizz', 'non riesco a pagare', ' fee ', ' fees ', 'installment'])) return R('fee');
  if (has(q, ['malat', 'febbre', 'influenza', 'assenz', 'giustific', 'medico', 'medica', 'stata male', 'stato male', 'sick', 'medical'])) return R('medical');
  if (/(chatgpt|chat gpt|intelligenza artificiale|gemini|claude|copilot|plagi|l'ai |l'ia |un'ai |un'ia | ai generativa| ia generativa|strumenti di (ai|ia) |tool di (ai|ia) |usare (l')?(ai|ia) | use ai | ai tools)/.test(q)) return R('ai');
  if (has(q, ['stamp', 'printer', ' print'])) return R('printer');
  if (has(q, ['meeting room', 'sala riunion', 'saletta', 'prenotare una sala', 'prenotare una stanza', 'prenotare sala'])) return R('room');
  if (has(q, ['posto per studiare', 'dove studiare', 'dove posso studiare', 'aula studio', 'sala studio', 'sale studio', 'study room', 'halliday', 'lavoro di gruppo', 'lavorare in gruppo', 'where can i study'])) return R('study');
  if (q.includes('enhancing')) return R('enh');
  if (has(q, [' voti', ' voto ', 'grades', 'libretto', 'learning engagement'])) return R('grades');
  if (has(q, ['biblioteca', 'library']) && has(q, ['orari', 'aperta', 'apre', 'chiude', 'orario', ' open', 'hours'])) return R('lib');
  if (officeK) return R('office', { k: officeK });
  if (has(q, [' ciao ', 'buongiorno', 'buonasera', ' hey ', ' salve ', ' hi ', ' hello '])) return R('hello');
  if (has(q, ['grazie', 'perfetto', 'ottimo', 'thanks', 'thank you', ' ok ', 'va bene'])) return R('thanks');
  if (isWay) return R('wayAsk');
  if (has(q, K.eventsSoft)) return R('events');
  return R('unknown');
}

function renderActs(m) {
  if (!m.acts || !m.acts.length) return '';
  const locked = m.done !== undefined && m.done !== null && !m.keep;
  return `<div class="acts${m.row ? ' row' : ''}">${m.acts.map((a, i) => {
    const picked = m.done === i ? ' picked' : '';
    const dis = locked ? ' disabled' : '';
    const inner = `${a.i ? I[a.i] : ''}${a.h || esc(a.l)}`;
    if (a.href) return `<a class="abtn ${a.c || ''}${picked}" href="${esc(a.href)}"${/^https?:/.test(a.href) ? ' target="_blank" rel="noopener"' : ''}>${inner}</a>`;
    return `<button class="abtn ${a.c || ''}${picked}" data-act="${a.a}" data-arg="${a.g === undefined ? '' : esc(a.g)}" data-mid="${m.id}" data-idx="${i}"${dis}>${inner}</button>`;
  }).join('')}</div>`;
}

function evCard(id) {
  const e = EVENTS[id]; const st = EVSTATE(id) || {};

    status = st.notify ? '<span class="pill green">Ti avviso io</span>' : '<span class="pill grey">Giorno da annunciare</span>';

  } else if (evPast(e)) {
    status = '<span class="pill grey">Concluso</span>';
    acts = `<button class="abtn" data-act="ev-open" data-arg="${id}">Dettagli</button>`;
  } else if (e.reg === 'none') {
    status = '<span class="pill grey">Nella sezione Eventi</span>';
    acts = `<button class="abtn" data-act="ev-open" data-arg="${id}">Dettagli</button>`;
  } else {
    status = st.reg ? '<span class="pill green">Iscritto</span>' : (e.reg === 'eventbrite' ? '<span class="pill navy">Iscrizione su Eventbrite</span>' : '<span class="pill navy">Iscrizione nell’app</span>');
    acts = st.reg ? `<button class="abtn" data-act="ev-ics" data-arg="${id}">${I.cal}Calendario</button><button class="abtn" data-act="ev-open" data-arg="${id}">Dettagli</button>`
      : `<button class="abtn pri" data-act="ev-reg" data-arg="${id}">${I.check}Iscrivimi</button><button class="abtn" data-act="ev-open" data-arg="${id}">Dettagli</button>`;
  }
  return `<div class="evc"><div class="evc-top ${e.c}"><span class="evc-tag">${e.demo ? 'Esempio' : 'Evento'}</span><b>${esc(e.t)}</b></div>
    <div class="evc-body"><div class="evc-row">${I.cal}<span>${esc(cap1(e.when))}${e.time && e.reg !== 'tba' ? ', ' + esc(e.time) : ''}</span></div>
    <div class="evc-row">${I.pin}<span>${esc(e.place)}</span></div><div style="margin-top:7px">${status}</div>
    <div class="evc-acts">${acts}</div></div></div>`;
}
function renderMsg(m) {
  if (m.kind === 'day') return `<div class="day">${esc(m.text)}</div>`;
  if (m.from === 'me') return `<div class="msg me" id="${m.id}"><div class="bub">${esc(m.text)}<div class="meta">${m.t}</div></div></div>`;
  const face = `<div class="fa"><img src="${FACE}" alt=""></div>`;
  if (m.kind === 'typing') return `<div class="msg" id="${m.id}">${face}<div class="bub"><div class="typing" aria-label="Casey sta scrivendo"><i></i><i></i><i></i></div></div></div>`;
  let inner = m.html || (m.text || '').split('\n\n').map((p) => `<p>${esc(p)}</p>`).join('');
  if (m.card) inner += m.card;
  if (m.evs) inner += m.evs.map(evCard).join('');
  inner += renderActs(m);
  if (m.src && m.src.length) inner += '<div>' + m.src.map(srcChip).join('') + '</div>';
  inner += `<div class="meta">${m.t}</div>`;
  return `<div class="msg" id="${m.id}">${face}<div class="bub">${inner}</div></div>`;
}

}
function qrSvg(seed, size = 150) {
  // disegno simile a un QR: non è un codice vero
  let x = seed; const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  const N = 25; let r = '';
  const finder = (cx, cy) => `<rect x="${cx}" y="${cy}" width="7" height="7" fill="#111"/><rect x="${cx + 1}" y="${cy + 1}" width="5" height="5" fill="#fff"/><rect x="${cx + 2}" y="${cy + 2}" width="3" height="3" fill="#111"/>`;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const inF = (i < 8 && j < 8) || (i < 8 && j > N - 9) || (i > N - 9 && j < 8);
    if (!inF && rnd() > 0.52) r += `<rect x="${j}" y="${i}" width="1" height="1" fill="#111"/>`;
  }
  return `<svg viewBox="0 0 ${N} ${N}" width="${size}" height="${size}" shape-rendering="crispEdges" role="img" aria-label="Codice QR di esempio"><rect width="${N}" height="${N}" fill="#fff"/>${r}${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}</svg>`;
}

}

  if (k.startsWith('ev:')) return eventSheet(k.slice(3));

  bsOpen(`<div class="kick">${esc(o.k)}</div><h4>${esc(o.t)}</h4>${o.rows ? rowsHtml(o.rows) : ''}${o.d ? `<p class="bsn" style="font-size:13.5px">${esc(o.d)}</p>` : ''}

function mkMsg(from, o, d) {
  const m = { id: uid(), from, t: hhmm(d), ts: d.getTime() };
  for (const k of FIELDS) if (o[k] !== undefined) m[k] = o[k];
  return m;
}
function saveChats() { store.set(KEY, JSON.stringify({ v: 1, chats: C.chats })); }
function loadChats() {
  try {
    const o = JSON.parse(store.get(KEY, 'null'));
    if (o && o.v === 1 && Array.isArray(o.chats)) return o.chats.filter((c) => c && c.id && Array.isArray(c.msgs) && c.msgs.length);
  } catch (e) { /* archivio illeggibile: si riparte dagli esempi */ }
  return null;
}

/* ---------- le chat di esempio, già salvate ---------- */
function seedChats() {
  const base = now();
  const at = (days, h, m) => { const d = addDays(base, -days); d.setHours(h, m, 0, 0); return d; };
  const mk = (title, start, list) => {
    let t = start.getTime();
    const msgs = list.map((x) => { const d = new Date(t); t += 60000; return typeof x === 'string' ? mkMsg('me', { text: x }, d) : mkMsg('casey', x, d); });
    return { id: uid('c'), title, created: start.getTime(), updated: t - 60000, msgs, seed: true };
  };
  let first = at(0, 9, 12); if (first > base) first = at(1, 8, 52);
  return [
    mk('Check-in in aula', first, ['Il check-in mi dà errore anche se sono in aula', SHARED.checkin()]),
    mk('Assenza per malattia', at(1, 18, 40), ['Sono stato malato 3 giorni: l’assenza è giustificata?', Object.assign(SHARED.medical(norm('Sono stato malato 3 giorni')), { done: 0 }), 'Ho perso un esame perché ero malato', SHARED.mitig()]),
    Object.assign(mk('Game Changer Italy', at(3, 14, 5), ['Cos’è Game Changer Italy?', eventAnswer('gci'), 'Chi sono gli speaker?', eventInfoText('gci', 'speakers')]), { ev: 'gci' }),
    mk('AI nell’assignment', at(4, 11, 30), ['Posso usare ChatGPT per l’assignment di Programming?', Object.assign(SHARED.ai(), { done: 0 }), SHARED.aiDraft()]),
    mk('Stampare in biblioteca', at(6, 16, 20), ['Come si stampa in biblioteca?', SHARED.printer(), 'Fino a che ora è aperta la biblioteca?', SHARED.lib()])
  ];
}

    case 'prot': case 'well': case 'emerg': return SHARED[c.k]();
    case 'who': return { text: 'Sono Casey, l’assistente AI dello Student Office di H-FARM College: un’intelligenza artificiale, non una persona. Rispondo sulle regole del college e sui servizi del campus, sempre con la fonte. Su tasse, eccezioni, benessere e segnalazioni decide una persona: ti indirizzo all’ufficio giusto.' };

/* ---------- invio ---------- */
async function userSays(text) {
  text = String(text || '').trim();
  if (!text || C.busy) return;
  if(window.CaseyLive?.active){window.CaseyLive.sendText(text);return;}
  C.busy = true;
  let chat = curChat();
  if (!chat) {
    const t0 = now();
    chat = { id: uid('c'), title: cap1(text.length > 44 ? text.slice(0, 42).replace(/\s+\S*$/, '') + '…' : text), created: t0.getTime(), updated: t0.getTime(), msgs: [] };
    C.chats.unshift(chat); C.cur = chat.id;
  }
  const me = mkMsg('me', { text }, now());
  chat.msgs.push(me); chat.updated = me.ts; saveChats();
  C.typingIn = chat.id;
  if (C.cur === chat.id) { renderHist(); renderChat('bottom'); }
  let reply;
  C.lastEvent = chat.ev || null; // ogni chat ricorda di quale evento si stava parlando
  try { reply = await CaseyApp.answer(text, chat.msgs.slice(0, -1)); chat.ev = C.lastEvent || null; } catch (e) { reply = { text: 'Scusa, qui qualcosa non ha funzionato. Riprova, oppure scrivi allo Student Office.', acts: [mailAct('so', 'Domanda per lo Student Office', text, 'Scrivi allo Student Office')], keep: true }; }
  await sleep(Math.min(1300, 550 + text.length * 6));
  const m = mkMsg('casey', reply, now());
  chat.msgs.push(m); chat.updated = m.ts; C.typingIn = null; C.busy = false; saveChats();
  if (C.cur === chat.id && T.tab === 'CASEY') { renderHist(); renderChat(m.id); } else if (T.tab === 'CASEY') renderHist();
}
function pick(mid, idx) {
  const chat = curChat(); if (!chat) return;
  const m = chat.msgs.find((x) => x.id === mid); if (!m) return;
  m.done = idx; saveChats();
  const n = document.getElementById(mid); if (n) n.outerHTML = renderMsg(m);
}
async function caseyAlone(reply, mid, idx) {
  // risposta di Casey a un pulsante (senza nuovo messaggio dello studente)
  if (C.busy) return; const chat = curChat(); if (!chat) return;
  if (mid !== undefined) pick(mid, idx);
  C.busy = true; C.typingIn = chat.id; renderChat('bottom');
  await sleep(650);
  const m = mkMsg('casey', reply, now()); chat.msgs.push(m); chat.updated = m.ts; C.typingIn = null; C.busy = false; saveChats();
  if (C.cur === chat.id && T.tab === 'CASEY') { renderHist(); renderChat(m.id); }
}

/* ---------- dettatura ---------- */
const STT = {
  rec: null,
  cancel() { if (!C.listening) return; C.listening = false; setMicUi(); try { this.rec && (this.rec.abort ? this.rec.abort() : this.rec.stop()); } catch (e) { /* ignore */ } },
  toggle() {
    if (C.listening) { try { this.rec && this.rec.stop(); } catch (e) { /* ignore */ } return; }
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!R) { toast('La dettatura funziona su Chrome, Edge e Safari: intanto puoi scrivere.'); return; }
    const rec = new R(); this.rec = rec; rec.lang = 'it-IT'; rec.interimResults = true; rec.maxAlternatives = 1;
    const inp = $('#cInput'); let finalText = '';
    rec.onresult = (e) => { let t = ''; for (let i = e.resultIndex; i < e.results.length; i++) { t += e.results[i][0].transcript; if (e.results[i].isFinal) finalText = t; } if (inp) inp.value = finalText || t; };
    rec.onerror = () => this.after('');
    rec.onend = () => this.after(finalText || (inp ? inp.value : ''));
    try { rec.start(); } catch (e) { toast('Microfono non disponibile'); return; }
    C.listening = true; setMicUi();
  },
  after(text) { if (!C.listening) return; C.listening = false; setMicUi(); if (text && text.trim()) { const i = $('#cInput'); if (i) i.value = ''; userSays(text.trim()); } }
};
function setMicUi() { const m = $('#micBtn'); if (m) { m.classList.toggle('on', C.listening); m.setAttribute('aria-label', C.listening ? 'Ferma la dettatura' : 'Detta il messaggio'); } }

let lastTap = { k: '', t: 0 };

  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;

  const key = act + '|' + (b.dataset.arg || '') + '|' + (b.dataset.mid || '');

}

  function restoreConversation(context, id) {const t=Date.now();C.chats=context.length?[{id:id||'cloud',title:context.find(m=>m.role==='user')?.text.slice(0,44)||'Conversazione',created:t,updated:t,msgs:context.map(m=>mkMsg(m.role==='user'?'me':'casey',{text:String(m.text||'')},new Date()))}]:[];C.cur=C.chats[0]?.id||null;if(C.built)renderCasey('bottom');}
  function appendVoiceTurn(role,text){if(!text)return;let chat=curChat();if(!chat){const t=Date.now();chat={id:uid('c'),title:String(text).slice(0,44),created:t,updated:t,msgs:[]};C.chats=[chat];C.cur=chat.id;}const from=role==='user'?'me':'casey';chat.msgs.push(mkMsg(from,{text},new Date()));chat.updated=Date.now();if(C.built)renderCasey('bottom');}
  function clearConversations(){C.chats=[];C.cur=null;localStorage.removeItem(KEY);if(C.built)renderCasey('top');}
  function applyProfile(p){Object.assign(STUDENT,{name:p?.display_name|| (p?'Il tuo account':'Ospite'),first:p?.first_name||'',ini:p?.display_name?p.display_name.split(' ').filter(Boolean).map(x=>x[0]).slice(0,2).join(''):'?'});Object.assign(U,STUDENT,{mail:p?.email||'—',code:p?.student_number||'—',deg:p?.program||'Corso non collegato',role:p?.registered?(p.program||'Profilo universitario verificato'):p?'Email verificata':'Accesso ospite'});$('#avBtn').textContent=U.ini;$('#avBtn').setAttribute('aria-label','Profilo di '+U.name);if(T.tab!=='CASEY')renderTab();if(C.built)renderChat();}
  window.__casey = { T, C, ACT, applyProfile, answer, classify, now, go, userSays, restoreConversation, appendVoiceTurn, clearConversations };
}
init();

</script>
