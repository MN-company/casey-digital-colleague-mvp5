/* =====================================================================
   Casey · design system condiviso tra app rossa (H-FARM Campus) e app blu
   (H-FARM College). Stesso contenitore dell'MVP: telefono pulito su sfondo
   scuro, solo la barra di stato minimale.
   ===================================================================== */
:root{
  --ink:#121426; --ink2:#4A4D63; --mute:#676A7E; --line:#E7E7EE; --soft:#F3F3F7; --soft2:#EEEFF5;
  --navy:#21264D; --navy2:#2E3570; --college:#1D2A5B; --college2:#2B3A74;
  --red:#E4342A; --red-d:#C32B22; --cred:#B3263A; --green:#14A06B; --amber:#E39A1C; --coral:#F4625C;
  --page:#0C1020;
  --sh1:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --sh2:0 6px 16px rgba(20,20,40,.08);
  --sh3:0 10px 26px rgba(33,38,77,.26);
  --r-card:20px;
  font-synthesis:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--page);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 12px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
img{display:block}
a{color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- contenitore del telefono (come nell'MVP) ---------- */
.phone{width:402px;max-width:100%;height:860px;max-height:calc(100vh - 40px);background:#fff;border-radius:36px;
  overflow:hidden;display:flex;flex-direction:column;position:relative;isolation:isolate;
  box-shadow:0 26px 70px rgba(0,0,0,.55);border:10px solid #080B14}
.sb{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;font-size:12px;font-weight:700;color:var(--ink);background:#fff;position:relative;z-index:5}
.sb .sbi{display:flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.02em}
.sb .sbi svg{height:11px;width:auto;display:block}
.app{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform}
.view.off-right{transform:translateX(102%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}

/* splash */
.splash{position:absolute;inset:0;background:#fff;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .45s}
.splash.go{opacity:0;pointer-events:none}
.splash img{width:148px;height:auto}
.splash .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--soft2);border-top-color:var(--brand,var(--navy));animation:sp .85s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* pulsante flottante di Casey */
.caseyb{position:absolute;right:16px;bottom:18px;width:62px;height:62px;z-index:40;transition:transform .2s,opacity .2s}
.caseyb .ph{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#fff;border:3px solid #fff;box-shadow:0 10px 26px rgba(16,20,40,.32)}
.caseyb img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.caseyb .bd{position:absolute;top:-2px;right:-2px;min-width:19px;height:19px;border-radius:10px;background:var(--red);border:2.5px solid #fff;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px}
.caseyb:active{transform:scale(.94)}
.caseyb.gone{opacity:0;pointer-events:none;transform:scale(.8)}

/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);background:rgba(18,20,38,.94);color:#fff;font-size:13px;font-weight:600;padding:10px 14px;border-radius:14px;z-index:250;opacity:0;transition:.25s;max-width:320px;text-align:center;pointer-events:none;line-height:1.35}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* foglio dal basso (fonti, QR, moduli) */
.bsw{position:absolute;inset:0;z-index:200;pointer-events:none}
.bsw .dim{position:absolute;inset:0;background:rgba(10,12,30,.42);opacity:0;transition:.25s}
.bsw .bs{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:10px 18px 26px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:82%;overflow:auto;box-shadow:0 -12px 30px rgba(0,0,0,.12)}
.bsw.open{pointer-events:auto}
.bsw.open .dim{opacity:1}
.bsw.open .bs{transform:none}
.bs .grab{width:40px;height:5px;border-radius:5px;background:#D5D6DE;margin:0 auto 12px}
.bs h4{font-size:18px;line-height:1.2}
.bs .kick{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cred);margin-bottom:4px}
.bs blockquote{margin-top:12px;border-left:3px solid var(--navy);padding:8px 12px;background:#F6F7FB;border-radius:0 12px 12px 0;font-size:14px;line-height:1.5}
.bs .bsn{font-size:12.5px;color:var(--ink2);margin-top:10px;line-height:1.45}
.bs .abtn{margin-top:14px;width:100%}
.bs .abtn+.abtn{margin-top:8px}
.bigqr{display:grid;place-items:center;margin:16px 0 6px}
.bigqr svg{border-radius:12px;box-shadow:0 0 0 10px #fff,0 0 0 11px var(--line)}

/* foglio della chat reale (college.html), gestito da app-auth-shell.js */
.sheet{position:absolute;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:flex-end;z-index:280}
.sheet.off{display:none}
.inner{background:#fff;width:100%;max-height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .34s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* ---------- messaggi ---------- */
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg.anim{animation:pop .28s ease}
.msg .fa{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:0 0 28px;background:#fff;border:1px solid var(--line)}
.msg .fa img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.bub{max-width:84%;background:var(--soft);border-radius:20px 20px 20px 6px;padding:10px 13px;font-size:14.4px;line-height:1.42;color:var(--ink);overflow-wrap:anywhere}
.bub p+p{margin-top:6px}
.bub b{font-weight:700}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--navy);color:#fff;border-radius:20px 20px 6px 20px}
.msg.me .bub .meta{color:#B9BDE3}
.meta{font-size:10.5px;color:var(--mute);margin-top:4px;text-align:right}
.src{display:inline-flex;align-items:center;gap:5px;margin-top:8px;margin-right:4px;font-size:11.5px;font-weight:700;color:var(--navy);background:#fff;border:1px solid #DADDF0;padding:4px 9px;border-radius:20px;text-align:left;line-height:1.2}
.src svg{width:13px;height:13px;flex:0 0 13px}
.src:hover{border-color:var(--navy)}
.acts{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.acts.row{flex-direction:row;flex-wrap:wrap}
.abtn{display:flex;align-items:center;gap:8px;justify-content:center;padding:11px 12px;border-radius:14px;font-weight:700;font-size:14px;background:#fff;border:1px solid #DADDF0;color:var(--navy);text-align:center;transition:.15s;text-decoration:none}
.abtn:hover{border-color:var(--navy)}
.abtn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.abtn.red{background:var(--cred);border-color:var(--cred);color:#fff}
.abtn svg{width:17px;height:17px;flex:0 0 17px}
.abtn[disabled]{opacity:.45;pointer-events:none}
.abtn.picked[disabled]{opacity:1}
.abtn.picked{background:#E2F6EC;border-color:#9BD9BC;color:#0B6E48}
.slot{justify-content:flex-start;text-align:left;gap:10px}
.slot .sl{display:flex;flex-direction:column;line-height:1.25}
.slot .sl small{font-weight:600;color:var(--ink2);font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
.card .ct{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px}
.card .ct .ok{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.card .ct .ok svg{width:13px;height:13px}
.card .ct>svg{width:18px;height:18px;flex:0 0 18px;color:var(--navy)}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:8px;font-size:13px}
.card dt{color:var(--mute);font-weight:600}
.card dd{font-weight:600}
.office{display:flex;gap:10px;align-items:center}
.office .oi{width:38px;height:38px;border-radius:12px;background:#E8EAF6;color:var(--navy);display:grid;place-items:center;flex:0 0 38px;font-weight:800;font-size:13px}
.office b{display:block;font-size:14px}
.office small{display:block;font-size:12px;color:var(--ink2);line-height:1.3}
.office code{font-family:inherit;font-weight:700;color:var(--navy);font-size:12.5px;display:block;margin-top:2px}
.mail{font-size:13px;line-height:1.45;white-space:pre-wrap;color:var(--ink);background:#FAFAFC;border-radius:12px;padding:10px;margin-top:8px;border:1px dashed #D9DBE8}
.proto{font-size:11px;color:var(--mute);margin-top:8px;line-height:1.35}
.qrmini{display:grid;place-items:center;margin-top:10px}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:#A3A6BA;display:block;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.pill.green{background:#E2F6EC;color:#0B6E48}
.pill.navy{background:#E8EAF6;color:var(--navy)}
.pill.grey{background:var(--soft);color:var(--ink2)}
.pill.amber{background:#FFF1DA;color:#8A5300}

/* eventi nella chat: sempre in colonna, mai caroselli */
.evc{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin-top:10px}
.evc-top{padding:10px 12px;color:#fff}
.evc-top b{display:block;font-size:15px;line-height:1.2;margin-top:5px;font-weight:800}
.evc-tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.28);padding:2px 7px;border-radius:20px}
.evc-body{padding:9px 12px 11px}
.evc-row{display:flex;gap:7px;align-items:flex-start;font-size:12.8px;color:var(--ink2);line-height:1.35;margin-top:3px}

.evc-acts{display:flex;gap:6px;margin-top:9px}
.evc-acts .abtn{flex:1;padding:8px;font-size:12.8px;border-radius:12px;gap:5px}
.evc-acts .abtn svg{width:14px;height:14px;flex:0 0 14px}
.e1{background:radial-gradient(circle at 80% 20%,#FF8A00 0%,rgba(255,138,0,0) 45%),linear-gradient(135deg,#1B1F3B,#3A2A6B)}
.e2{background:radial-gradient(circle at 20% 30%,#FF5E62 0%,rgba(255,94,98,0) 50%),linear-gradient(135deg,#2B1E1E,#7A2E2E)}
.e3{background:radial-gradient(circle at 70% 70%,#2BD2FF 0%,rgba(43,210,255,0) 50%),linear-gradient(135deg,#0D1B2A,#1B3A5B)}
.e4{background:radial-gradient(circle at 30% 70%,#F9D423 0%,rgba(249,212,35,0) 50%),linear-gradient(135deg,#3B2B12,#7A5A1E)}
.e5{background:radial-gradient(circle at 75% 30%,#8C6CFF 0%,rgba(140,108,255,0) 50%),linear-gradient(135deg,#241C44,#3A2E6B)}

/* suggerimenti: vanno a capo, niente scorrimento orizzontale */
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:8px 14px 6px;flex:0 0 auto}
.chip{padding:7px 11px;border-radius:20px;border:1px solid #DADDF0;font-size:12.6px;font-weight:600;color:var(--navy);background:#fff;line-height:1.25;max-width:100%}
.chip:hover{border-color:var(--navy)}
.chip.hot{background:#E8EAF6;border-color:#E8EAF6}

@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(179,38,58,.5)}100%{box-shadow:0 0 0 7px rgba(179,38,58,0)}}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes glow{0%,100%{box-shadow:var(--sh3)}50%{box-shadow:0 10px 34px rgba(179,38,58,.42)}}

:focus{outline:none}
:focus-visible{outline:2.5px solid #5B6BFF;outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---------- su un telefono vero l'app occupa tutto lo schermo ---------- */
@media (max-width:500px){
  body{padding:0;display:block;background:#fff}
  .phone{width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
  .sb{display:none}
}

/* =====================================================================
   App rossa · H-FARM Campus
   ===================================================================== */
body{--brand:var(--red)}
.splash img{width:136px}

/* ---------- home ---------- */
.hhead{padding:8px 18px 2px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hlogo{display:flex;align-items:center;gap:9px;min-width:0}
.hlogo img{height:34px;width:auto;flex:none}
.hlogo span{font-weight:800;font-size:16px;letter-spacing:-.01em}
.hbtns{display:flex;gap:10px;align-items:center}
.qrbtn{width:42px;height:42px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(228,52,42,.35)}
.qrbtn svg{width:19px;height:19px}
.avbtn{width:42px;height:42px;border-radius:50%;background:#1F2430;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:.02em;box-shadow:var(--sh1)}
.greet{padding:12px 18px 0;font-size:27px;line-height:1.12;font-weight:500;letter-spacing:-.02em}
.greet b{font-weight:800}
.greet small{display:block;font-size:13px;font-weight:600;color:var(--mute);letter-spacing:0;margin-top:5px}

/* card di Casey sotto il saluto */
.ccard{margin:14px 16px 4px;border-radius:24px;background:linear-gradient(135deg,#21264D 0%,#2B3168 60%,#3B2350 100%);color:#fff;padding:14px;position:relative;overflow:hidden;box-shadow:var(--sh3)}
.ccard::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(228,52,42,.5),rgba(228,52,42,0) 70%);pointer-events:none}
.ccard .top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.ccard .face{width:44px;height:44px;border-radius:50%;overflow:hidden;background:#fff;flex:0 0 44px;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.ccard .face img{width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.ccard .who b{display:block;font-size:14.5px}
.ccard .who small{display:block;font-size:11.5px;color:#C8CBEA;margin-top:1px}
.ccard .live{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.14);padding:4px 8px;border-radius:20px;display:flex;align-items:center;gap:5px}
.ccard .live i{width:6px;height:6px;border-radius:50%;background:#3BE39B;display:block}
.ccard .cmsg{position:relative;z-index:1;font-size:15.5px;line-height:1.35;font-weight:600;margin:12px 2px}
.ccard .cmsg small{display:block;font-weight:500;font-size:12.5px;color:#C8CBEA;margin-top:5px}
.ccard .cacts{display:flex;gap:8px;position:relative;z-index:1}
.ccard .cacts button{flex:1;padding:10px;border-radius:14px;font-weight:700;font-size:13.5px;background:rgba(255,255,255,.13);text-align:center;line-height:1.2}
.ccard .cacts button.w{background:#fff;color:var(--navy)}
.ccard.attn{animation:glow 2.4s ease-in-out 2}

.shead{display:flex;align-items:baseline;justify-content:space-between;padding:20px 18px 12px}
.shead h3{font-size:22px;font-weight:800;letter-spacing:-.02em}
.shead button{color:var(--red);font-weight:700;font-size:14px}

/* griglia del campus: solo verticale, come l'app originale */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:0 16px}
.tile{position:relative;border-radius:var(--r-card);color:#fff;padding:14px 14px 50px;min-height:138px;overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;box-shadow:var(--sh2);transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile.w3{grid-column:span 3;min-height:124px}
.tile.w2{grid-column:span 2}
.tile.w1{grid-column:span 1;padding-right:12px}
.tile .kk{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.95}
.tile .tt{font-size:18px;font-weight:800;line-height:1.12;letter-spacing:-.015em;margin-top:5px;max-width:92%}
.tile.w1 .tt{font-size:15px}
.tile .ic{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.tile .ic svg{width:21px;height:21px}
.tile .bdg{position:absolute;left:13px;bottom:13px;background:var(--red);color:#fff;min-width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;border:2px solid #fff;padding:0 5px}
.g-rest{background:linear-gradient(135deg,#EE6A5C 0%,#D94A3C 100%)}
.g-about{background:linear-gradient(135deg,#B46AEA,#C98BF2)}
.g-shop{background:linear-gradient(135deg,#1FAFA4,#3ECBBC)}
.g-parc{background:linear-gradient(135deg,#6C7FD6,#8695E2)}
.g-ev{background:linear-gradient(135deg,#34AE6B,#5ACB8D)}
.g-way{background:linear-gradient(135deg,#76B23F,#AECB3B)}
.g-wal{background:linear-gradient(135deg,#EFA238,#F5BC45)}
.g-net{background:linear-gradient(135deg,#2C3E50,#4A6076)}

/* riquadro "Chiedi a Casey": la testa non va mai tagliata */
.tile.casey{grid-column:span 3;height:152px;min-height:152px;padding:16px 150px 16px 16px;background:linear-gradient(120deg,#21264D 0%,#2D336D 52%,#7A2240 100%);justify-content:center}
.tile.casey .kk{display:flex;align-items:center;gap:6px}
.tile.casey .new{background:#fff;color:var(--cred);font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:20px}

.tile.casey .desc{font-size:12.5px;line-height:1.32;color:#D6D8F0;margin-top:6px;font-weight:500}
.tile.casey .bust{position:absolute;right:8px;bottom:0;height:140px;width:auto;pointer-events:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}

.banner{grid-column:span 3;border-radius:var(--r-card);overflow:hidden;min-height:118px;position:relative;background:linear-gradient(100deg,#E8402E,#C9271C);display:flex;align-items:center;padding:18px;color:#fff;text-align:left;box-shadow:var(--sh2)}
.banner .t{font-size:26px;font-weight:800;line-height:1.02;letter-spacing:-.8px;position:relative;z-index:1}
.banner .s{font-size:11px;margin-top:7px;opacity:.95;line-height:1.35;position:relative;z-index:1}
.banner::after{content:"";position:absolute;right:0;top:0;bottom:0;width:44%;background:linear-gradient(90deg,rgba(214,43,30,0),rgba(0,0,0,.38))}
.mini{grid-column:span 1;border-radius:16px;overflow:hidden;min-height:92px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:11.5px;font-weight:800;color:#fff;line-height:1.2;box-shadow:var(--sh2)}
.hfoot{height:96px}

/* ---------- menu laterale ---------- */
.menu{position:absolute;inset:0;z-index:150;pointer-events:none}
.menu .dim{position:absolute;inset:0;background:rgba(10,12,30,.35);opacity:0;transition:.25s}

.mprof{display:flex;gap:12px;align-items:center;padding:4px 4px 18px}

.mlist{display:flex;flex-direction:column;gap:8px}

.mrow.casey .mi{overflow:hidden}
.mrow.casey .mi img{width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.mrow.casey .newp{margin-left:auto;background:#fff;color:var(--cred);font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:20px}
.mrow.casey .chv{margin-left:8px;color:#C9CCE6}
.mfoot{margin-top:auto;padding-top:16px;font-size:11.5px;color:var(--mute);line-height:1.4}

.phead{padding:12px 16px 14px;display:flex;align-items:center;gap:12px;color:#fff;flex:0 0 auto}

.evl .nm{display:flex;align-items:center;gap:8px;font-size:16.5px;font-weight:800;margin-top:10px;letter-spacing:-.2px}

.srch{display:flex;align-items:center;gap:11px;background:var(--soft);border-radius:14px;padding:13px 16px;font-size:15px;color:var(--mute);margin-bottom:14px}

.prow{display:flex;border-radius:16px;overflow:hidden;background:var(--soft);margin-bottom:12px}

.prow .in{padding:12px 14px;flex:1;min-width:0}
.prow .in b{display:block;font-size:15.5px;font-weight:800}
.prow .in p{margin-top:5px;font-size:12.6px;color:var(--ink2);line-height:1.35}
.prow .in .pr{margin-top:8px;font-size:14px;font-weight:800;color:var(--red)}
.rcard{margin-bottom:8px}
.rcard .im{border-radius:18px;height:108px;display:flex;align-items:flex-end;padding:14px;box-shadow:var(--sh2)}
.rcard .im span{font-size:24px;font-weight:800;color:rgba(255,255,255,.95);letter-spacing:-.5px}
.rcard .hr{display:flex;justify-content:space-between;gap:14px;padding:12px 2px 18px;font-size:14.5px}

.closed{background:var(--soft);margin:0 -16px;padding:20px 16px 8px}

.mapwrap{position:relative;flex:1;min-height:0;overflow:hidden}

.dest{position:absolute;left:12px;right:12px;bottom:70px;z-index:4;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;align-items:center;gap:11px}

.dest .from{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--navy);background:#E8EAF6;padding:4px 8px;border-radius:20px;white-space:nowrap}

.mapsrch{position:absolute;left:12px;right:12px;bottom:14px;background:rgba(255,255,255,.94);backdrop-filter:blur(7px);border-radius:999px;padding:13px 18px;font-size:14.5px;color:var(--mute);display:flex;gap:10px;align-items:center;z-index:3;box-shadow:0 2px 9px rgba(0,0,0,.12)}

.ph-empty{text-align:center;padding:26px 10px}

.ph-empty h4{font-size:19px}
.ph-empty p{font-size:14px;color:var(--ink2);margin-top:8px;line-height:1.45}
.ph-empty .abtn{margin-top:16px}
/* pagina di un evento */
.evhero{height:170px;padding:16px 18px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;position:relative;flex:none}
.evhero .tag2{position:absolute;top:14px;left:16px;font-size:10px;font-weight:800;letter-spacing:.08em;background:rgba(0,0,0,.28);padding:3px 8px;border-radius:20px;text-transform:uppercase}
.evhero .bk{position:absolute;top:12px;right:14px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.evhero .bk svg{width:18px;height:18px}
.evhero b{font-size:26px;line-height:1.05;font-weight:800;letter-spacing:-.015em}

.evbody{padding:16px 18px 30px}

.evbody .abtn{width:100%;margin-bottom:8px}
.fromc{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:700;color:var(--navy);background:#E8EAF6;padding:5px 10px;border-radius:20px}

function evIdOf(q) {
  if (q.includes('game changer') || q.includes('gamechanger')) return 'gci';

  if (has(q, ["cosa c'e", 'cosa succede', 'evento', 'eventi', 'programma', "what's on", 'whats on', 'happening'])) {
    for (const id of ['gci', 'talk']) {
      const e = EVENTS[id], d = evStart(e); if (!d || evPast(e)) continue;
      const g = norm(GIORNI[d.getDay()]).trim(), dm = d.getDate() + ' ' + MESI[d.getMonth()], n = dayDiff(d, now());
      if ((q.includes(' ' + g) && n < 7) || (q.includes(' ' + g + ' prossim') && n < 14) || q.includes(' ' + dm) || (q.includes(' domani') && n === 1) || (q.includes(' oggi') && n === 0)) return id;

  }
  return null;
}

function classify(text, ctx = {}) {
  const q = norm(text);
  const R = (k, a) => ({ k, a, q });
  if (has(q, K.prot)) return R('prot');
  if (has(q, K.well)) return R('well');
  if (has(q, K.emerg)) return R('emerg');
  if (has(q, K.who)) return R('who');
  if (has(q, K.human)) return R('human');
  if (/^ (che ore sono|che ora e|che ore e|che giorno e( oggi)?|che giorno siamo( oggi)?|oggi che giorno e|quanti ne abbiamo( oggi)?|what time is it|what day is it( today)?) $/.test(q)) return R('time');
  const evId = evIdOf(q);
  const lunchW = has(q, K.lunch);
  const officeK = Object.keys(OFFICES).find((k) => OFFICES[k].k.length && hasW(q, OFFICES[k].k));
  const parcelW = has(q, K.parcel);
  const wantsReg = has(q, K.reg) && !has(q, K.notCourse);
  if (K.cancel.test(q) && (lunchW || evId || has(q, ['iscrizione', 'prenotazione', 'registrazione', 'booking', 'registration', 'evento']))) return R('cancel', { evId, lunch: lunchW });
  if (evId && has(q, K.speak)) return R('evinfo', { id: evId, kind: 'speakers' });
  if (!evId && ctx.lastEvent && has(q, ['speaker', 'chi parla', 'relator', 'ospiti', 'chi interviene'])) return R('evinfo', { id: ctx.lastEvent, kind: 'speakers' });
  if (has(q, K.price) && (evId || (ctx.lastEvent && !lunchW && !officeK && !has(q, K.gym) && !has(q, K.sportRent) && !has(q, K.digital)))) return R('evinfo', { id: evId || ctx.lastEvent, kind: 'price' });
  if (q.includes('networking')) return R('evinfo', { id: evId || 'gci', kind: 'networking' });
  if (has(q, ['pagina di iscrizione', 'link di iscrizione', 'link per iscriver', 'pagina per iscriver', 'dove mi iscrivo', 'pagina di registrazione', "pagina dell'evento", 'registration page', 'registration link', 'link to register'])) return R('regpage', { id: evId || ctx.lastEvent || 'gci' });
  if (wantsReg && evId) return R('register', { id: evId });
  if (wantsReg && ctx.lastEvent && !officeK && !lunchW && !parcelW && words(q) <= 6) return R('register', { id: ctx.lastEvent });
  if (evId) return R('event', { id: evId });
  if (has(q, ['hacktoberfest', 'hack day'])) return R('hack');
  if (q.includes('grok')) return R('grok');
  if (parcelW) return R('parcel');
  const isWay = has(q, K.way);
  const dest = Object.keys(WF).find((key) => WF[key].k.length && has(q, WF[key].k));

  if (isWay && lunchW && ctx.lunchToday) return R('way', { dest: RESTOS[ctx.lunchToday].wf });
  if (lunchW) return R(K.book.test(q) || /^ prenota /.test(q) ? 'lunchbook' : 'lunch');
  if (has(q, K.digital)) return R('digital');
  if (has(q, K.gym)) return R('gym');
  if (has(q, K.sportRent)) return R('sportRent');
  if (has(q, K.mobility)) return R('mobility');
  if (has(q, K.shop)) return R('shop');
  if (has(q, K.newsletter)) return R('newsletter');
  if (has(q, K.events) || (q.includes("cosa c'e") && has(q, ['settimana', 'oggi', 'domani', 'stasera', 'weekend'])) || (wantsReg && !officeK)) return R('events');
  const badgeW = has(q, ['badge', 'tesserino']);
  if (badgeW && has(q, K.badgeLost)) return R('badgeLost');
  if (badgeW) return R('badge');
  if (has(q, ['check-in', 'check in', 'checkin', 'check-out', 'check out', 'checkout', 'presenza in aula', 'registrare la presenza', 'firmare la presenza'])) return R('checkin');
  if (has(q, ['esame perso', 'perso un esame', "perso l'esame", "saltato l'esame", 'saltato un esame', 'mitigating', 'missed an exam', 'missed my exam'])) return R('mitig');
  if (has(q, [' rata', ' rate ', 'retta', 'tasse', 'tuition', 'dilazion', 'rateizz', 'non riesco a pagare', ' fee ', ' fees ', 'installment'])) return R('fee');
  if (has(q, ['malat', 'febbre', 'influenza', 'assenz', 'giustific', 'medico', 'medica', 'stata male', 'stato male', 'sick', 'medical'])) return R('medical');
  if (/(chatgpt|chat gpt|intelligenza artificiale|gemini|claude|copilot|plagi|l'ai |l'ia |un'ai |un'ia | ai generativa| ia generativa|strumenti di (ai|ia) |tool di (ai|ia) |usare (l')?(ai|ia) | use ai | ai tools)/.test(q)) return R('ai');
  if (has(q, ['stamp', 'printer', ' print'])) return R('printer');
  if (has(q, ['meeting room', 'sala riunion', 'saletta', 'prenotare una sala', 'prenotare una stanza', 'prenotare sala'])) return R('room');
  if (has(q, ['posto per studiare', 'dove studiare', 'dove posso studiare', 'aula studio', 'sala studio', 'sale studio', 'study room', 'halliday', 'lavoro di gruppo', 'lavorare in gruppo', 'where can i study'])) return R('study');
  if (q.includes('enhancing')) return R('enh');
  if (has(q, [' voti', ' voto ', 'grades', 'libretto', 'learning engagement'])) return R('grades');
  if (has(q, ['biblioteca', 'library']) && has(q, ['orari', 'aperta', 'apre', 'chiude', 'orario', ' open', 'hours'])) return R('lib');
  if (officeK) return R('office', { k: officeK });
  if (has(q, [' ciao ', 'buongiorno', 'buonasera', ' hey ', ' salve ', ' hi ', ' hello '])) return R('hello');
  if (has(q, ['grazie', 'perfetto', 'ottimo', 'thanks', 'thank you', ' ok ', 'va bene'])) return R('thanks');
  if (isWay) return R('wayAsk');
  if (has(q, K.eventsSoft)) return R('events');
  return R('unknown');
}

function qrSvg(seed, size = 150) {
  // disegno simile a un QR: non è un codice vero
  let x = seed; const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  const N = 25; let r = '';
  const finder = (cx, cy) => `<rect x="${cx}" y="${cy}" width="7" height="7" fill="#111"/><rect x="${cx + 1}" y="${cy + 1}" width="5" height="5" fill="#fff"/><rect x="${cx + 2}" y="${cy + 2}" width="3" height="3" fill="#111"/>`;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const inF = (i < 8 && j < 8) || (i < 8 && j > N - 9) || (i > N - 9 && j < 8);
    if (!inF && rnd() > 0.52) r += `<rect x="${j}" y="${i}" width="1" height="1" fill="#111"/>`;
  }
  return `<svg viewBox="0 0 ${N} ${N}" width="${size}" height="${size}" shape-rendering="crispEdges" role="img" aria-label="Codice QR di esempio"><rect width="${N}" height="${N}" fill="#fff"/>${r}${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}</svg>`;
}

// calendario: fuso orario di Roma e righe piegate a 75 byte (RFC 5545)
const VTZ_ROME = ['BEGIN:VTIMEZONE', 'TZID:Europe/Rome', 'BEGIN:DAYLIGHT', 'TZOFFSETFROM:+0100', 'TZOFFSETTO:+0200', 'TZNAME:CEST', 'DTSTART:19700329T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU', 'END:DAYLIGHT',
  'BEGIN:STANDARD', 'TZOFFSETFROM:+0200', 'TZOFFSETTO:+0100', 'TZNAME:CET', 'DTSTART:19701025T030000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'END:STANDARD', 'END:VTIMEZONE'];
const icsEsc = (t) => String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
function icsFold(line) { const enc = new TextEncoder(); const out = []; let cur = '', n = 0; for (const ch of line) { const b = enc.encode(ch).length; if (n + b > 75) { out.push(cur); cur = ' '; n = 1; } cur += ch; n += b; } out.push(cur); return out.join('\r\n'); }
const icsDate = (a) => `${a[0]}${pad(a[1] + 1)}${pad(a[2])}T${pad(a[3])}${pad(a[4])}00`;
function downloadEventIcs(id) {
  const e = EVENTS[id]; if (!e.date) return;
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Casey//H-FARM Campus//IT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', ...VTZ_ROME, 'BEGIN:VEVENT',
    `UID:casey-${id}-${icsDate(e.date)}@casey`, `DTSTAMP:${stamp}`, `DTSTART;TZID=Europe/Rome:${icsDate(e.date)}`, `DTEND;TZID=Europe/Rome:${icsDate(e.end)}`,
    `SUMMARY:${icsEsc(e.t)}`, `LOCATION:${icsEsc(e.place + ', Via Adriano Olivetti 1, Roncade (TV)')}`];
  if (e.info || e.url) lines.push('URL:' + (e.info || e.url));
  lines.push(`DESCRIPTION:${icsEsc(e.demo ? 'Evento di esempio del prototipo Casey.' : 'Iscrizione gestita da Casey (prototipo).')}`, 'BEGIN:VALARM', 'TRIGGER:-PT60M', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(e.t + ' tra un’ora')}`, 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR');
  const url = URL.createObjectURL(new Blob([lines.map(icsFold).join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = `${e.t.replace(/\s+/g, '_')}.ics`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Evento aggiunto: file .ics scaricato');
}

function iLunchBook(q) {
  const n = now(), mins = n.getHours() * 60 + n.getMinutes();
  const wantTomorrow = has(q, ['domani', 'tomorrow']);
  const lt = lunchToday();
  if (!wantTomorrow && lt) { const R = RESTOS[lt.r]; return casey({ text: `Hai già il pranzo prenotato oggi da ${R.n}.`, acts: [{ l: 'Mostra il QR', a: 'lunch-qr', g: 'today', c: 'pri', i: 'qr' }, { l: 'Portami lì', a: 'way-to', g: R.wf, i: 'pin' }], keep: true }, { think: 500 }); }
  if (wantTomorrow) return askLunchTomorrow(q);
  if (mins >= 12 * 60) return casey({ text: `Sono le ${hhmm()}: le prenotazioni per il pranzo di oggi si sono chiuse alle 12:00. Posso prenotarti per domani.`, acts: [{ l: 'Sì, per domani', a: 'lunch-tomorrow', c: 'pri', i: 'fork' }, { l: 'No, grazie', a: 'nothanks' }], src: ['rest'] }, { think: 700 });
  const choices = lunchChoices(false);
  const r = restoIn(q);
  if (r && restoOpenOn(r, n)) return lunchConfirm(r, false);
  S.lunch.step = 1; S.lunch.tomorrow = false; S.pend = { k: 'lunch' };
  const left = 12 * 60 - mins;
  return casey({ text: `Sono le ${hhmm()}: le prenotazioni per oggi si chiudono alle 12:00, mancano ${left} minuti. Dove vuoi mangiare?`, voice: `Le prenotazioni per oggi si chiudono a mezzogiorno: mancano ${left} minuti. Dove vuoi mangiare?`, acts: choices, src: ['rest', 'app_rist'] }, { think: 700 });
}
function askLunchTomorrow(q) {
  const d = addDays(now(), 1);

  const r = q ? restoIn(q) : null;
  if (r && restoOpenOn(r, d)) return lunchConfirm(r, true);
  S.lunch.step = 1; S.lunch.tomorrow = true; S.pend = { k: 'lunch' };
  const wk = d.getDay() === 0 || d.getDay() === 6;

function lunchConfirm(r, tomorrow, typed) {

  'ev-page'(id, mid, b) { if (mid) pick(mid, +b.dataset.idx); return iRegPage(id); },
  'ev-reg'(id, mid, b) { if (S.screen !== 'casey') { openCasey('chip', true); S.opened = true; } if (mid && b) pick(mid, +b.dataset.idx); pushMsg({ from: 'me', text: `Iscrivimi a ${EVENTS[id].t}` }); return iRegister(id); },
  'ev-casey'(id) { return userSays(EVENTS[id].reg === 'tba' ? `Avvisami per ${EVENTS[id].t}` : `Iscrivimi a ${EVENTS[id].t}`); },
  'ev-checkout'(id, mid, b) { if (mid) pick(mid, +b.dataset.idx); evCheckout(id); },
  'ev-confirm'(id) { return evConfirm(id); },
  'talk-yes'(id, mid, b) { if (mid) pick(mid, +b.dataset.idx); return evConfirm(id); },
  'ev-reg-direct'(id) { if (S.ev[id].reg) return; S.ev[id].reg = true; refreshAll(); renderEventPage(id, S.placeFrom); toast('Iscrizione fatta (simulata)'); },
  'ev-notify'(id) { return evNotify(id); },
  'ev-ics'(id) { downloadEventIcs(id); },
  'lunch-pick'(g, mid, b) { if (mid) pick(mid, +b.dataset.idx); const [r, tm] = g.split(':'); return lunchConfirm(r, tm === 't'); },
  'lunch-tomorrow'(a, mid, b) { if (mid) pick(mid, +b.dataset.idx); return askLunchTomorrow(''); },
  'lunch-qr'(g) { lunchQr(g); },
  'way-to'(k) { openPlace('way', S.screen === 'casey' ? 'casey' : 'home', k); },
  'parcel-notify'(a, mid, b) { if (mid) pick(mid, +b.dataset.idx); S.parcelNotify = true; refreshAll(); return casey({ text: 'Ok: appena arriva un pacco ti mando una notifica, con il codice di ritiro.' }, { end: 'D', think: 500 }); },
  'cancel-yes'(g, mid, b) { if (mid) pick(mid, +b.dataset.idx); return cancelDo(g); }
};
// Campus provider writes are unavailable; only the authenticated backend may confirm an operation.
for (const action of ['ev-reg','ev-checkout','ev-confirm','talk-yes','ev-reg-direct','ev-notify','lunch-pick','lunch-tomorrow','lunch-qr','parcel-notify','cancel-yes','qr']) {
 ACT[action] = () => bsOpen('<div class="kick">Servizi campus</div><h4>Continua sul portale ufficiale</h4><p class="bsn">Questo servizio non è collegato a Casey. Qui non è stata effettuata alcuna prenotazione, iscrizione o attivazione. Per gli appuntamenti Student Office usa la chat personale.</p><button class="abtn pri" data-act="bs-close">Ho capito</button>');
}
ACT['ai-draft'] = () => userSays('Quali sono le regole sull’uso dell’AI nei compiti?');
ACT.logout = () => openAccount();
const CONVO = new Set(['say', 'ai-draft', 'nothanks', 'ev-reg', 'ev-page', 'ev-checkout', 'ev-confirm', 'talk-yes', 'lunch-pick', 'lunch-tomorrow', 'parcel-notify', 'cancel-yes']);
let lastTap = { k: '', t: 0 };
function onClick(e) {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  e.preventDefault(); VOICE.unlock();
  const k = b.dataset.act + '|' + (b.dataset.arg || '') + '|' + (b.dataset.mid || ''); const t = Date.now();
  if (k === lastTap.k && t - lastTap.t < 700) return;
  lastTap = { k, t };
  if (CONVO.has(b.dataset.act)) interrupt();
  quietly(f(b.dataset.arg, b.dataset.mid, b, e));
}
function tick() { const el = $('#clock'); if (el) el.textContent = hhmm(now()); }

function init() {
  $('#sbIcons').innerHTML = statusIcons();
  tick(); setInterval(tick, 10000);
  if (TOUCH && window.innerHeight < 700) S.heroSmall = true;
  renderHome(); renderMenu(); buildCasey(); setFab();
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if ($('#bsheet').classList.contains('open')) bsClose(); else if (S.menuOpen) closeMenu(); else if (S.screen === 'place') closePlace(); });
  setTimeout(() => { const s = $('#splash'); if (s) s.classList.add('go'); }, 900);
  function applyProfile(p){Object.assign(STUDENT,{name:p?.display_name||(p?'Il tuo account':'Ospite'),first:p?.first_name||'',ini:p?.display_name?p.display_name.split(' ').filter(Boolean).map(x=>x[0]).slice(0,2).join(''):'?'});Object.assign(U,STUDENT,{mail:p?.email||'—',code:p?.student_number||'—',role:p?.registered?(p.program||'Profilo universitario verificato'):p?'Email verificata':'Accesso ospite'});renderHome();renderMenu();if(S.screen==='casey')renderCasey();}
  window.__casey = { S, ACT, applyProfile, route, userSays, classify, now, AV, restoreConversation(context){S.thread=context.map(t=>({from:t.role==='user'?'me':'casey',text:String(t.text||''),id:'m'+(++MID),t:hhmm()}));if(S.screen==='casey')renderCasey();},appendVoiceTurn(role,text){pushMsg({from:role==='user'?'me':'casey',text});},clearConversations(){S.thread=[];if(S.screen==='casey')renderCasey();} };
}
init();

</script>
