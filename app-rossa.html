<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H-FARM Campus — App</title>
<style>
:root{--red:#E4342A;--red-d:#C32B22;--ink:#111418;--mut:#6B7280;--bor:#E9EAEC;--head:#EFEFF0;
 --ok:#16764C;--ok-bg:#EAF4EF;--wait:#A8700C;--wait-bg:#FDF6E7}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
button{border:0;background:none;cursor:pointer;font:inherit;color:inherit;padding:0;text-align:inherit}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 background:#0C1020;color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 12px}
.phone{width:402px;max-width:100%;height:860px;max-height:92vh;background:#fff;border-radius:36px;
 overflow:hidden;display:flex;flex-direction:column;position:relative;
 box-shadow:0 26px 70px rgba(0,0,0,.55);border:10px solid #080B14}
.sb{background:var(--head);padding:9px 20px 0;display:flex;justify-content:space-between;font-size:11.5px;font-weight:600}
/* splash */
.splash{position:absolute;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:26px;transition:opacity .45s}
.splash.go{opacity:0;pointer-events:none}
.splash img{width:148px;height:auto;display:block}
.splash .spin{width:26px;height:26px;border-radius:50%;border:3px solid #F0D5D3;border-top-color:var(--red);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- intestazione ---------- */
.hdr{background:var(--head);padding:8px 20px 16px}
.hdr .top{display:flex;align-items:center;gap:10px}
.hdr .lg{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.hdr .lg img{height:34px;width:auto;display:block;flex:none}
.hdr .lg span{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.qrb{width:42px;height:42px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
.pfb{width:46px;height:46px;border-radius:50%;background:#D4D6DA;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:none}
.hdr h1{margin:13px 0 0;font-size:27px;font-weight:800;letter-spacing:-.7px;line-height:1.15}
/* ---------- corpo ---------- */
.body{flex:1;overflow:auto;background:#fff;padding:22px 16px 30px}
.secrow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.secrow h2{margin:0;font-size:25px;font-weight:800;letter-spacing:-.6px}
.secrow button{color:var(--red);font-size:15px;font-weight:600;display:flex;align-items:center;gap:5px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.tile{position:relative;border-radius:15px;overflow:hidden;color:#fff;padding:14px 14px 46px;min-height:136px;
 display:flex;flex-direction:column;justify-content:flex-start;text-align:left}
.tile .kk{font-size:11.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;opacity:.96}
.tile .tt{font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1.2;margin-top:3px}
.tile.w1 .tt{font-size:15.5px}
.tile .ic{position:absolute;right:13px;bottom:12px;opacity:.95}
.tile.w3{grid-column:span 3;min-height:152px}
.tile.w2{grid-column:span 2}
.tile.w1{grid-column:span 1}
.dots{position:absolute;right:13px;top:14px;display:flex;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5);display:block}
.dots i.on{background:#fff}
.bdg{position:absolute;left:13px;bottom:12px;background:var(--red);color:#fff;width:26px;height:26px;
 border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700}
.tile .bgart{position:absolute;inset:0;z-index:0}
.tile .fg{position:relative;z-index:1}
.banner{grid-column:span 3;border-radius:15px;overflow:hidden;min-height:124px;position:relative;
 background:linear-gradient(100deg,#E8402E,#D62B1E);display:flex;align-items:center;padding:18px;color:#fff}
.banner .t{font-size:27px;font-weight:800;line-height:1.02;letter-spacing:-.8px}
.banner .s{font-size:10.6px;margin-top:7px;opacity:.95;line-height:1.35}
.banner .ph{position:absolute;right:0;top:0;bottom:0;width:42%;
 background:linear-gradient(90deg,rgba(214,43,30,0),rgba(0,0,0,.42))}
.mini{grid-column:span 1;border-radius:13px;overflow:hidden;height:92px;display:flex;align-items:center;
 justify-content:center;text-align:center;padding:10px;font-size:11.5px;font-weight:800;color:#fff;line-height:1.2}
/* ---------- sottopagine ---------- */
.page{position:absolute;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;
 animation:slide .3s cubic-bezier(.2,.8,.3,1)}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
.ph-head{padding:18px 18px 16px;display:flex;align-items:center;gap:14px;color:#fff}
.ph-head .bk{font-size:21px;line-height:1}
.ph-head .ti{font-size:17px;font-weight:700;letter-spacing:.3px;flex:1}
.ph-body{flex:1;overflow:auto;padding:18px 16px 28px}
.chips{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.chips button{flex:none;border-radius:999px;padding:9px 19px;font-size:15px;font-weight:600;background:#F0F1F3;color:var(--mut)}
.chips button[aria-selected="true"]{background:#DCDEE2;color:var(--ink)}
.nrow{display:flex;gap:13px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--bor)}
.nrow .bar{width:3px;align-self:stretch;border-radius:2px;flex:none}
.nrow .mid{flex:1;min-width:0}
.nrow .ti{font-size:17px;font-weight:600;line-height:1.25;letter-spacing:-.3px}
.nrow .mt{display:flex;align-items:center;gap:10px;margin-top:8px}
.tag{font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px}
.nrow .dt{font-size:13.5px;color:#9AA0A8}
.nrow .th{width:72px;height:72px;border-radius:11px;flex:none;overflow:hidden;display:flex;
 align-items:center;justify-content:center;font-size:8.6px;font-weight:800;color:#fff;text-align:center;padding:5px;line-height:1.15}
.evcard{margin-bottom:22px}
.evcard .im{border-radius:14px;height:124px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.evcard .db{position:absolute;left:14px;top:50%;transform:translateY(-50%);background:#fff;border-radius:11px;
 padding:9px 14px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.evcard .db b{display:block;font-size:21px;font-weight:800;line-height:1}
.evcard .db span{font-size:9.6px;font-weight:600;letter-spacing:.4px}
.evcard .nm{font-size:17px;font-weight:700;margin-top:11px;letter-spacing:-.3px}
.srch{display:flex;align-items:center;gap:11px;background:#F0F1F3;border-radius:14px;padding:13px 16px;
 font-size:15px;color:#9AA0A8;margin-bottom:15px}
.sortrow{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sortrow .sp{background:#F0F1F3;border-radius:999px;padding:9px 16px;font-size:14px;color:var(--mut);font-weight:500}
.sortrow .mine{margin-left:auto;background:#111;color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700}
.prow{display:flex;gap:0;border-radius:13px;overflow:hidden;background:#F4F5F7;margin-bottom:13px}
.prow .im{width:112px;flex:none;min-height:108px;display:flex;align-items:center;justify-content:center;
 font-size:9.6px;font-weight:700;color:#fff;text-align:center;padding:8px;line-height:1.2}
.prow .in{padding:13px 14px;flex:1;min-width:0}
.prow .in b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.3px}
.prow .in p{margin:5px 0 0;font-size:13px;color:var(--mut);line-height:1.35}
.prow .in .pr{margin-top:8px;font-size:14.5px;font-weight:700;color:var(--red)}
.rcard{margin-bottom:8px}
.rcard .im{border-radius:14px;height:112px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:14px}
.rcard .im span{font-size:25px;font-weight:800;color:rgba(255,255,255,.92);letter-spacing:-.5px}
.rcard .hr{display:flex;justify-content:space-between;gap:14px;padding:14px 2px 20px}
.rcard .hr b{font-size:15px;font-weight:700}
.rcard .hr span{font-size:15px;font-weight:600;text-align:left;line-height:1.35}
.closed{background:#F4F5F7;margin:0 -16px;padding:22px 16px 10px}
.closed h3{margin:0 0 16px;font-size:21px;font-weight:800;color:var(--red);letter-spacing:-.4px}
.mapwrap{border-radius:0;overflow:hidden;position:relative;flex:1}
.mapchips{position:absolute;top:13px;left:13px;right:13px;display:flex;gap:10px;z-index:3}
.mapchips div{background:#fff;border-radius:999px;padding:9px 16px;font-size:14.5px;font-weight:600;
 display:flex;align-items:center;gap:8px;box-shadow:0 2px 9px rgba(0,0,0,.16)}
.locb{position:absolute;right:16px;bottom:78px;width:50px;height:50px;border-radius:50%;background:#fff;
 display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.22);z-index:3}
.mapsrch{position:absolute;left:14px;right:14px;bottom:16px;background:rgba(255,255,255,.92);backdrop-filter:blur(7px);
 border-radius:999px;padding:14px 20px;font-size:15px;color:#9AA0A8;display:flex;gap:11px;align-items:center;z-index:3}
/* ---------- pannello profilo ---------- */
.drawer{position:absolute;inset:0;z-index:30;display:flex}
.drawer.off{display:none}
.drawer .scrim{flex:1;background:rgba(0,0,0,.35)}
.drawer .panel{width:84%;background:#fff;padding:18px 18px 24px;overflow:auto;animation:dr .28s cubic-bezier(.2,.8,.3,1)}
@keyframes dr{from{transform:translateX(100%)}to{transform:none}}
.drawer .ttl{display:flex;align-items:center;justify-content:flex-end;gap:8px;color:var(--red);font-size:16px;font-weight:700}
.drawer .me{text-align:center;margin:18px 0 22px}
.drawer .me .av{width:96px;height:96px;border-radius:50%;background:#D4D6DA;margin:0 auto 12px;
 display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.drawer .me b{font-size:19px;font-weight:800;letter-spacing:-.3px}
.drawer .me .sub{display:block;font-size:13px;color:var(--mut);margin-top:3px}
.drawer a.it{display:flex;align-items:center;justify-content:space-between;background:#F4F5F7;border-radius:13px;
 padding:16px 18px;margin-bottom:10px;font-size:16.5px;font-weight:700;color:var(--ink);text-decoration:none}
.drawer a.it span{color:#B6BAC1;font-size:17px}
/* ---------- Casey ---------- */
.caseyb{position:absolute;right:16px;bottom:20px;width:62px;height:62px;z-index:12}
.caseyb .ph{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#fff;
 border:3px solid #fff;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.caseyb img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.caseyb .bd{position:absolute;top:-2px;right:-2px;width:18px;height:18px;border-radius:50%;background:var(--red);
 border:2.5px solid #fff;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sheet{position:absolute;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:flex-end;z-index:40}
.sheet.off{display:none}
.inner{background:#fff;width:100%;max-height:92%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;
 animation:up .34s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sh{padding:15px 18px 12px;border-bottom:1px solid var(--bor)}
.sh .r{display:flex;align-items:center;gap:11px}
.sh .cav{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;background:#eee}
.sh .cav img{width:100%;height:100%;object-fit:cover;object-position:center}
.sh h2{margin:0;font-size:15.5px}
.sh .st{font-size:11.4px;color:var(--mut)}
.sh .x{margin-left:auto;font-size:21px;color:#98A2B3;line-height:1}
.sh .ok{margin-top:10px;font-size:11.4px;color:var(--ok);background:var(--ok-bg);border:1px solid #CFE6DB;
 border-radius:8px;padding:7px 10px;display:flex;gap:7px;align-items:flex-start}
.msgs{padding:15px 18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px;min-height:170px}
.m{max-width:88%;border-radius:14px;padding:10px 13px;font-size:13px;line-height:1.46}
.m.me{align-self:flex-end;background:#F0F1F3;border-bottom-right-radius:5px}
.m.ca{align-self:flex-start;background:#1F2430;color:#fff;border-bottom-left-radius:5px}
.m.ca .cite{margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.22);font-size:10.5px;color:#B9BFCC}
.typing{align-self:flex-start;background:#F2F4F8;border-radius:14px;padding:11px 14px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9AA4B8;display:block;animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.chatbar{display:flex;gap:8px;padding:11px 14px 16px;border-top:1px solid var(--bor)}
.chatbar input{flex:1;min-width:0;border:1px solid var(--bor);border-radius:999px;padding:11px 15px;font-size:13.4px;background:#F6F7F9}
.chatbar input:focus{outline:2px solid var(--red);outline-offset:-1px;background:#fff}
.chatbar button{flex:none;width:42px;height:42px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body><div style="text-align:center;background:#fff3db;padding:8px;font:13px system-ui">Demo Campus · dati e operazioni simulati</div>
<div class="phone" id="phone">
  <div class="splash" id="splash">
    <img src="hfarm-logo.png" alt="H-FARM">

  <div class="sb"><span id="clock">16:24</span><span>5G ▮▮▮</span></div>
  <div class="hdr">
    <div class="top">
      <div class="lg">
        <img src="hfarm-logo.png" alt="H-FARM">
        <span>Campus</span>
      </div>
      <button class="qrb" aria-label="Codice">

      </button>
    </div>
    <h1 id="greet"></h1>
  </div>
  <div class="body" id="body"></div>

  <button class="caseyb" onclick="openSheet()" aria-label="Chiedi a Casey">
    <span class="ph"><img src="casey-face.png" alt=""></span><span class="bd" id="cbd">1</span>

    <div class="inner">
      <div class="sh">
        <div class="r">
          <div class="cav"><img src="casey-face.png" alt=""></div>
          <div><h2>Casey</h2><div class="st" id="shSt"></div></div>

      </div>
      <div class="msgs" id="msgs"></div>
      <div class="acts" id="acts" style="padding:0 18px"></div>
      <div class="chatbar">
        <input id="chatIn" type="text" placeholder="Scrivi a Casey…" autocomplete="off" onkeydown="if(event.key==='Enter')sendChat()">
        <button onclick="sendChat()" aria-label="Invia">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

   e non solo per il College. Stessa persona dell'app blu.

function saluto(){const h=new Date().getHours();return h<13?'Buongiorno':(h<18?'Buon Pomeriggio':'Buonasera');}

/* gradienti ricalcati dall'app vera */
const G={
 rist:'linear-gradient(135deg,#E8695C,#D94A3C)',
 about:'linear-gradient(135deg,#B46AEA,#C98BF2)',
 shop:'linear-gradient(135deg,#1FAFA4,#3ECBBC)',
 pacchi:'linear-gradient(135deg,#6C7FD6,#8695E2)',

 news:'<rect x="3" y="5" width="13" height="15" rx="1.6"/><path d="M16 8h3a1.6 1.6 0 0 1 1.6 1.6v8.8A1.6 1.6 0 0 1 19 20M6 9h7M6 12.5h7M6 16h4"/>',
 cart:'<circle cx="9.5" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2.5 3h3l2.6 12.4h10.2l2.2-8.4H6.3"/>',
 box:'<path d="M12 3 21 7.6v8.8L12 21l-9-4.6V7.6z"/><path d="m3 7.6 9 4.6 9-4.6M12 12.2V21"/>',

function ic(k,sz){return '<svg class="ic" width="'+(sz||30)+'" height="'+(sz||30)+'" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+IC[k]+'</svg>';}

/* contenuti che ruotano nelle due card con il carosello */
const ABOUT_ROT=[

 {t:'Grok Bot Meetup di SpaceXAI e H-FARM',art:'linear-gradient(135deg,#0B0B0C,#1C1C1F)'}
];

 {t:'GAME CHANGER ITALY',art:'linear-gradient(135deg,#0B0B0C,#2A2416)'}
];
let rotA=0, rotE=0;

const NEWS=[
 ['Hacktoberfest Hack Day Treviso','Events','16 ottobre','#2E7D5B','linear-gradient(135deg,#243028,#1A241D)','HACKTOBERFEST'],
 ['Hacktoberfest Hack Day 2026, hackathon open source in H-…','News','15 ottobre','#A855F7','linear-gradient(135deg,#1F2A22,#2C3B2E)','HACK DAY'],

function tile(cls,bg,kk,tt,icon,extra,art){
  return '<button class="tile '+cls+'" style="background:'+bg+'" onclick="'+(extra&&extra.go?extra.go:'')+'">'+
    (art?'<div class="bgart" style="background:'+art+'"></div>':'')+
    '<div class="fg"><div class="kk">'+kk+'</div><div class="tt">'+tt+'</div></div>'+
    (icon?ic(icon):'')+
    (extra&&extra.dots!==undefined?dots(extra.dots[0],extra.dots[1]):'')+
    (extra&&extra.badge?'<div class="bdg">'+extra.badge+'</div>':'')+'</button>';
}

const ESCAL=['rimborso','nota spese','fattura','eccezione','fuori policy','disdetta','storno'];

let msgs=[];
function paintMsgs(){
  document.getElementById('msgs').innerHTML=msgs.map(function(m){
    return m.r==='me' ? '<div class="m me">'+esc(m.t)+'</div>'
      : '<div class="m ca">'+esc(m.t)+(m.c?'<div class="cite">'+esc(m.c)+'</div>':'')+'</div>';
  }).join('');
  const b=document.getElementById('msgs'); b.scrollTop=b.scrollHeight;
}
function openSheet(){
  document.getElementById('cbd').style.display='none';
  document.getElementById('shSt').textContent = CID ? 'conversazione arrivata dal totem' : 'sempre disponibile qui dentro';
  document.getElementById('shOk').textContent = 'Profilo letto dall\'app: '+U.name+' · '+U.code+'.'+(CID?' Sessione '+CID+'.':'' );
  if(!msgs.length){
    msgs=[{r:'ca',t:'Ciao '+FIRST+". Posso dirti orari, spazi, tessere e servizi del campus. E se serve apro io la pratica, perché so chi sei.",c:'Profilo verificato dall\'app'}];
  }
  paintMsgs();
  document.getElementById('sheet').classList.remove('off');
}
function closeSheet(){ document.getElementById('sheet').classList.add('off'); }
function showTyping(){
  const b=document.getElementById('msgs'), d=document.createElement('div');
  d.className='typing'; d.id='tp'; d.innerHTML='<i></i><i></i><i></i>';
  b.appendChild(d); b.scrollTop=b.scrollHeight;
}
function hideTyping(){ const d=document.getElementById('tp'); if(d) d.remove(); }
function sendChat(){
  const el=document.getElementById('chatIn'), t=(el.value||'').trim();
  if(!t) return;
  el.value=''; msgs.push({r:'me',t:t}); paintMsgs(); showTyping();
  setTimeout(function(){ hideTyping(); reply(t.toLowerCase()); }, 560);
}
function reply(q){
  if(ESCAL.some(function(k){return q.indexOf(k)>=0;})){
    msgs.push({r:'ca',t:"Su rimborsi ed eccezioni non decido io. Preparo la richiesta con il riferimento alla policy e la mando all'amministrazione del campus, che ti risponde direttamente.",
               c:'Smistata a una persona · bozza già pronta'});
    paintMsgs(); return;
  }
  for(var i=0;i<KB.length;i++){
    if(KB[i].k.some(function(k){return q.indexOf(k)>=0;})){
      msgs.push({r:'ca',t:KB[i].a,c:KB[i].c}); paintMsgs(); return;
    }
  }
  if(['ciao','buongiorno','salve','buonasera','come stai','come va','grazie'].some(function(k){return q.indexOf(k)>=0;})){
    msgs.push({r:'ca',t: q.indexOf('grazie')>=0 ? "Di niente, "+FIRST+"." : "Ciao "+FIRST+". Dimmi pure."});
    paintMsgs(); return;
  }
  msgs.push({r:'ca',t:"Su questo non ho una fonte verificata, quindi non rispondo a caso. Posso girare la domanda al servizio competente allegando il tuo profilo: la mando?",
             c:'Nessuna fonte verificata · non invento'});
  paintMsgs();
}
